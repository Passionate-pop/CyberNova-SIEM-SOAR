    # ── Backend API ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # ── WebSocket ──────────────────────────────────────────────────────
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health / Ready / Metrics / Docs ────────────────────────────────
    location /health {
        access_log off;
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }
    location /ready {
        access_log off;
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }
    location /metrics {
        access_log off;
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }
    location /docs {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # ── CyberNova App (SPA) at /app/ ──────────────────────────────────
    # proxy_pass with trailing slash strips the /app/ prefix:
    #   /app/assets/foo.js -> frontend receives /assets/foo.js
    location /app/ {
        proxy_pass http://frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Marketing Landing Page at / ────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /error.json {
        internal;
        default_type application/json;
        return 502 '{"status":"error","message":"Service unavailable"}';
    }
