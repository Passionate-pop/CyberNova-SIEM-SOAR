apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cybernova.fullname" . }}
  labels:
    {{- include "cybernova.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cybernova.fullname" . }}
  labels:
    {{- include "cybernova.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cybernova.fullname" . }}
  labels:
    {{- include "cybernova.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cybernova.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cybernova.fullname" . }}
