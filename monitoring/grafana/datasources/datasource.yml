# CyberNova — Grafana Datasource Provisioning
apiVersion: 1

deleteDatasources: []

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    uid: prometheus
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 30s
