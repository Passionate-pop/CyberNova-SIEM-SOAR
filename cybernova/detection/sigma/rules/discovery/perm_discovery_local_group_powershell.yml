title: Local Group Discovery Via PowerShell
id: a1000007-0015-4000-8000-000000000015
description: Detects local group discovery using PowerShell Get-LocalGroup cmdlet
references:
    - https://attack.mitre.org/techniques/T1069/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1069.001
logsource:
