title: Email Account Or Contact Search Via EWS / Graph API
id: a1000007-0010-4000-8000-000000000010
description: Detects searches for email accounts or contacts via Exchange Web Services or Microsoft Graph API
references:
    - https://attack.mitre.org/techniques/T1087/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1087.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: \powershell.exe
        CommandLine|contains:
            - 'FindUsers'
            - 'SearchUsers'
            - 'Get-UserPhoto'
            - 'Get-Mailbox'
    condition: selection
falsepositives:
    - Email client auto-discovery
    - Administrative scripts
level: medium
