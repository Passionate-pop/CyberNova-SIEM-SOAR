title: Token Group Enumeration Via Whoami
id: a1000007-0021-4000-8000-000000000021
description: Detects enumeration of token groups using whoami /groups command
references:
    - https://attack.mitre.org/techniques/T1069/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1069
logsource:
    category: process_creation
    product: windows
detection:
