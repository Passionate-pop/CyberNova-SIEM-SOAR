title: Local Account Discovery Via PowerShell
id: a1000007-0003-4000-8000-000000000003
description: Detects local account enumeration using PowerShell Get-LocalUser cmdlet
references:
    - https://attack.mitre.org/techniques/T1087/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1087.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: \powershell.exe
        CommandLine|contains: Get-LocalUser
    condition: selection
falsepositives:
    - Administrative PowerShell scripts
    - Security auditing tools
level: low
