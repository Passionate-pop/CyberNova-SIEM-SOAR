title: Registry Query For Antivirus Product Detection
id: a1000007-0023-4000-8000-000000000023
description: Detects registry queries for antivirus product information
references:
    - https://attack.mitre.org/techniques/T1012/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1012
logsource:
    category: registry_query
    product: windows
detection:
    selection:
        TargetObject|contains:
            - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
            - 'SOFTWARE\Microsoft\Security Center'
            - 'Windows Defender\'
    condition: selection
falsepositives:
    - Security software inventory
    - System health checks
level: low
