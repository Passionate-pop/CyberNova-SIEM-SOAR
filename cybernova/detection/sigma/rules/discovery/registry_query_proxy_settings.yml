title: Registry Query For Proxy Settings
id: a1000007-0032-4000-8000-000000000032
description: Detects registry queries for proxy configuration settings
references:
    - https://attack.mitre.org/techniques/T1012/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1012
logsource:
    category: registry_query
    product: windows
detection:
    selection:
        TargetObject|contains:
            - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings\ProxyServer'
            - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings\ProxyEnable'
            - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings\AutoConfigURL'
    condition: selection
falsepositives:
    - Browser configuration
    - Network setup scripts
level: low
