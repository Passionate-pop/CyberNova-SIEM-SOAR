title: Cloud Group Enumeration
id: a1000007-0019-4000-8000-000000000019
description: Detects cloud group enumeration using IAM ListGroups or similar APIs
references:
    - https://attack.mitre.org/techniques/T1069/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1069.003
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith:
            - /aws
            - /az
            - /gcloud
        CommandLine|contains:
            - ListGroups
            - list-groups
            - Get-AzureADGroup
    condition: selection
falsepositives:
    - Cloud administration activities
    - Automated deployment scripts
level: medium
