title: Local Group Discovery Via WMI
id: a1000007-0014-4000-8000-000000000014
description: Detects local group discovery using WMI queries against Win32_Group
references:
    - https://attack.mitre.org/techniques/T1069/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1069.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: \wmic.exe
        CommandLine|contains: Win32_Group
    condition: selection
falsepositives:
    - Administrative scripts
    - Inventory tools
level: low
