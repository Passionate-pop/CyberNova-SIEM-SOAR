title: Domain Account Discovery Via Dsquery
id: a1000007-0007-4000-8000-000000000007
description: Detects domain account discovery using dsquery command-line tool
references:
    - https://attack.mitre.org/techniques/T1087/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1087.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: \dsquery.exe
        CommandLine|contains|all:
            - 'user'
            - 'samid'
    condition: selection
falsepositives:
    - Domain administrative tasks
    - Help desk operations
level: low
