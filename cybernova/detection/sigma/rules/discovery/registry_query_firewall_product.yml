title: Registry Query For Firewall Product Detection
id: a1000007-0024-4000-8000-000000000024
description: Detects registry queries for firewall product information
references:
    - https://attack.mitre.org/techniques/T1012/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1012
logsource:
    category: registry_query
    product: windows
detection:
    selection:
        TargetObject|contains:
            - 'SYSTEM\CurrentControlSet\Services\SharedAccess'
            - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
            - 'Windows Firewall'
    condition: selection
falsepositives:
    - Network troubleshooting
    - Security audits
level: low
