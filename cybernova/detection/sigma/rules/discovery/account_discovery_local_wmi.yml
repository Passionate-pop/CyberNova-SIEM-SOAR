title: Local Account Discovery Via WMI
id: a1000007-0002-4000-8000-000000000002
description: Detects local account discovery using WMI queries against Win32_UserAccount
references:
    - https://attack.mitre.org/techniques/T1087/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1087.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: \wmic.exe
        CommandLine|contains: Win32_UserAccount
    condition: selection
falsepositives:
    - Administrative scripts gathering user information
    - Inventory tools
level: low
