title: Registry Query For User SID
id: a1000007-0033-4000-8000-000000000033
description: Detects registry queries for user SID enumeration from ProfileList
references:
    - https://attack.mitre.org/techniques/T1012/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1012
logsource:
    category: registry_query
    product: windows
detection:
    selection:
        TargetObject|contains:
            - 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList'
            - 'ProfileGuid'
            - 'ProfileImagePath'
    condition: selection
falsepositives:
    - User profile management
    - System administration tasks
level: low
