title: Local Group Enumeration Via Net Localgroup
id: a1000007-0013-4000-8000-000000000013
description: Detects local group enumeration using net localgroup command
references:
    - https://attack.mitre.org/techniques/T1069/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1069.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: \net.exe
        CommandLine|contains|all:
            - 'localgroup'
    condition: selection
falsepositives:
    - Administrative tasks
    - IT support scripts
level: low
