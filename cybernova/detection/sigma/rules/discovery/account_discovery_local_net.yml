title: Local Account Enumeration Via Net Commands
id: a1000007-0001-4000-8000-000000000001
description: Detects local account enumeration using net user command
references:
    - https://attack.mitre.org/techniques/T1087/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1087.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: \net.exe
        CommandLine|contains|all:
            - 'net'
            - 'user'
    condition: selection
falsepositives:
    - Administrative activity
    - Scripts that enumerate local users
level: low
