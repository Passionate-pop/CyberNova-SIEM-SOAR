title: Registry Query For Installed Software
id: a1000007-0028-4000-8000-000000000028
description: Detects registry queries enumerating installed software from Uninstall keys
references:
    - https://attack.mitre.org/techniques/T1012/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1012
logsource:
    category: registry_query
    product: windows
detection:
    selection:
        TargetObject|contains:
            - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*'
            - 'SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    condition: selection
falsepositives:
    - Software inventory tools
    - Patch management systems
level: low
