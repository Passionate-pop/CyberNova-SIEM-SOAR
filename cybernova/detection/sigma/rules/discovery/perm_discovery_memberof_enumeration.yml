title: User Group Membership Enumeration
id: a1000007-0022-4000-8000-000000000022
description: Detects enumeration of user group memberships via net user /domain or PowerShell AD cmdlets
references:
    - https://attack.mitre.org/techniques/T1069/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1069
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - \net.exe
            - \powershell.exe
        CommandLine|contains:
            - '/memberof'
            - 'memberof'
            - 'Get-ADGroupMember'
            - 'Get-ADPrincipalGroupMembership'
    condition: selection
falsepositives:
    - Active Directory management
    - User access reviews
level: medium
