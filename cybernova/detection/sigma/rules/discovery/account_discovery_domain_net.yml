title: Domain Account Enumeration Via Net Commands
id: a1000007-0005-4000-8000-000000000005
description: Detects domain account enumeration using net group or net user /domain commands
references:
    - https://attack.mitre.org/techniques/T1087/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1087.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: \net.exe
        CommandLine|contains|all:
            - 'net'
            - 'group'
    condition: selection
falsepositives:
    - Domain administration activities
    - IT support scripts
level: low
