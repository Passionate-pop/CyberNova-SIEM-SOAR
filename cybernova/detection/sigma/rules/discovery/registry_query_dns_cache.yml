title: Registry Query For DNS Cache And Resolver Information
id: a1000007-0031-4000-8000-000000000031
description: Detects registry queries for DNS resolver cache and configuration
references:
    - https://attack.mitre.org/techniques/T1012/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1012
logsource:
    category: registry_query
    product: windows
detection:
    selection:
        TargetObject|contains:
            - 'SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\NameServer'
            - 'SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\SearchList'
            - 'SYSTEM\CurrentControlSet\Services\Dnscache\Parameters'
    condition: selection
falsepositives:
    - Network diagnostics
    - DNS client operations
level: low
