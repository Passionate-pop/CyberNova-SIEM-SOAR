title: Domain Group Enumeration Via Net Group /domain
id: a1000007-0016-4000-8000-000000000016
description: Detects domain group enumeration using net group /domain command
references:
    - https://attack.mitre.org/techniques/T1069/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1069.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: \net.exe
        CommandLine|contains|all:
            - 'group'
            - '/domain'
    condition: selection
falsepositives:
    - Domain administration tasks
    - IT help desk operations
level: low
