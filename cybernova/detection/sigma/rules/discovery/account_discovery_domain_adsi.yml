title: Domain Account Discovery Via ADSI
id: a1000007-0008-4000-8000-000000000008
description: Detects domain account discovery via ADSI (Active Directory Service Interfaces) in PowerShell
references:
    - https://attack.mitre.org/techniques/T1087/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1087.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: \powershell.exe
        CommandLine|contains|all:
            - 'ADSI'
            - 'WinNT'
            - 'user'
    condition: selection
falsepositives:
    - Administrative scripts using ADSI
    - Identity management software
level: medium
