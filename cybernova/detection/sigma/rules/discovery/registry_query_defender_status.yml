title: Registry Query For Windows Defender Status
id: a1000007-0025-4000-8000-000000000025
description: Detects registry queries checking Windows Defender status and configuration
references:
    - https://attack.mitre.org/techniques/T1012/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1012
logsource:
    category: registry_query
    product: windows
detection:
    selection:
        TargetObject|contains:
            - 'SOFTWARE\Microsoft\Windows Defender\Status'
            - 'SOFTWARE\Microsoft\Windows Defender\Real-Time Protection'
            - 'SOFTWARE\Policies\Microsoft\Windows Defender\DisableAntiSpyware'
    condition: selection
falsepositives:
    - Security monitoring software
    - Administrative checks
level: medium
