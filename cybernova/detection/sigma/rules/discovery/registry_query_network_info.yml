title: Registry Query For Network Configuration
id: a1000007-0030-4000-8000-000000000030
description: Detects registry queries for network interface and TCP/IP configuration
references:
    - https://attack.mitre.org/techniques/T1012/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1012
logsource:
    category: registry_query
    product: windows
detection:
    selection:
        TargetObject|contains:
            - 'SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces'
            - 'SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\DhcpDefaultGateway'
            - 'SYSTEM\CurrentControlSet\Control\Network\NetworkAdapters'
    condition: selection
falsepositives:
    - Network troubleshooting
    - DHCP client operations
level: low
