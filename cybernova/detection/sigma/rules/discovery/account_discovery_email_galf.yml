title: Email Global Address List Enumeration
id: a1000007-0009-4000-8000-000000000009
description: Detects enumeration of Global Address List (GAL) via Exchange or Graph API
references:
    - https://attack.mitre.org/techniques/T1087/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1087.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: \powershell.exe
        CommandLine|contains|all:
            - 'GlobalAddressList'
            - 'Exchange'
    condition: selection
falsepositives:
    - Mailbox migration scripts
    - Email administration tasks
level: medium
