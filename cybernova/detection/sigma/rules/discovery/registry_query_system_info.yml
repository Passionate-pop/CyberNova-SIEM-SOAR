title: Registry Query For System Information
id: a1000007-0026-4000-8000-000000000026
description: Detects registry queries for system information such as OS version, build, and configuration
references:
    - https://attack.mitre.org/techniques/T1012/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1012
logsource:
    category: registry_query
    product: windows
detection:
    selection:
        TargetObject|contains:
            - 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProductName'
            - 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\CurrentBuild'
            - 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\ReleaseId'
            - 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\InstallDate'
    condition: selection
falsepositives:
    - System administration
    - Software installation routines
level: low
