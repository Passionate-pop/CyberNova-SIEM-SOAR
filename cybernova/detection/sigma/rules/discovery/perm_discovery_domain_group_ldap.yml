title: Domain Group Discovery Via LDAP
id: a1000007-0017-4000-8000-000000000017
description: Detects domain group discovery using LDAP queries
references:
    - https://attack.mitre.org/techniques/T1069/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1069.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - \adsisearcher.exe
            - \adfind.exe
        CommandLine|contains:
            - objectCategory=group
            - objectClass=group
    condition: selection
falsepositives:
    - Active Directory administration
    - Identity management tools
level: medium
