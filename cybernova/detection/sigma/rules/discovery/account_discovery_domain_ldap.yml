title: Domain Account Discovery Via LDAP Queries
id: a1000007-0006-4000-8000-000000000006
description: Detects domain account discovery using LDAP queries executed via AD tools
references:
    - https://attack.mitre.org/techniques/T1087/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1087.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - \adsisearcher.exe
            - \adfind.exe
            - \adexplorer.exe
        CommandLine|contains:
            - objectCategory=user
            - objectClass=user
            - (objectCategory=person)
    condition: selection
falsepositives:
    - Active Directory administration tools
    - Identity management software
level: medium
