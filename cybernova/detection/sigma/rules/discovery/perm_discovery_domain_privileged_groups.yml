title: Domain Privileged Group Enumeration
id: a1000007-0018-4000-8000-000000000018
description: Detects enumeration of domain privileged groups such as Domain Admins and Enterprise Admins
references:
    - https://attack.mitre.org/techniques/T1069/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.discovery
    - attack.t1069.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - \net.exe
            - \powershell.exe
            - \dsquery.exe
        CommandLine|contains:
            - 'Domain Admins'
            - 'Enterprise Admins'
            - 'Schema Admins'
            - 'Group Policy Creator Owners'
    condition: selection
falsepositives:
    - Domain administration during group policy updates
    - Security audits
level: high
