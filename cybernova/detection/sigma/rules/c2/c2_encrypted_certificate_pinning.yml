title: Certificate Pinning in Suspicious Process
id: a1000010-0026-4000-8000-000000000026
description: Detects certificate pinning implementation within processes not typically associated with such security measures, indicative of C2 traffic hardening
references:
    - https://attack.mitre.org/techniques/T1573/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.command_and_control
    - attack.t1573.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_pinning:
        api_call|contains:
            - 'CertGetCertificateChain'
            - 'CertVerifyCertificateChainPolicy'
            - 'CertOpenStore'
            - 'CertFindCertificateInStore'
        hash_comparison: true
    selection_suspicious_proc:
        image_path|contains:
            - '\AppData\'
            - '\Temp\'
            - '\Users\\*\Desktop\'
            - 'C:\Windows\Temp\'
    condition: selection_pinning and selection_suspicious_proc
falsepositives:
    - Legitimate applications with custom certificate validation
    - Security software with certificate checking
    - VPN clients and secure messaging apps
level: medium
