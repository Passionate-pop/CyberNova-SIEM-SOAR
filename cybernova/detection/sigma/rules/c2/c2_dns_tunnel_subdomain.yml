title: Excessive Subdomain Depth DNS Queries
id: a1000010-0021-4000-8000-000000000021
description: Detects DNS queries with excessive subdomain depth, a common technique used in DNS tunneling for C2 communication
references:
    - https://attack.mitre.org/techniques/T1071/004/
author: CyberNova
date: 2025-01-01
tags:
    - attack.command_and_control
    - attack.t1071.004
logsource:
    category: dns
    product: windows
detection:
    selection:
        dns_query|re: '^([a-zA-Z0-9.-]+\.[a-zA-Z0-9-]+\.){3,}[a-zA-Z]{2,}$'
        dns_query_length|gte: 100
    condition: selection
falsepositives:
    - Long legitimate subdomain names in cloud environments
    - CDN auto-generated subdomains
    - Application-defined subdomain hierarchies
level: high
