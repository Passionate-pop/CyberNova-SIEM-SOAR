title: C2-Specific HTTP Headers
id: a1000010-0003-4000-8000-000000000003
description: Detects HTTP requests containing custom headers commonly associated with C2 frameworks
references:
    - https://attack.mitre.org/techniques/T1071/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: proxy
    product: windows
detection:
    selection_custom:
        http_header|contains:
            - 'X-Server:'
            - 'X-Client:'
            - 'X-Auth:'
            - 'X-ID:'
            - 'X-Session:'
            - 'X-Encoded:'
            - 'X-Salt:'
            - 'X-Key:'
            - 'Cookie: session='
            - 'Authorization: Bearer'
        dst_port: 80
    selection_unusual:
        http_header_name|contains:
            - 'X-Cmd'
            - 'X-Result'
            - 'X-Task'
            - 'X-Payload'
            - 'MIME-Version'
    condition: selection_custom or selection_unusual
falsepositives:
    - Custom application headers
    - Legacy API integrations
level: low
