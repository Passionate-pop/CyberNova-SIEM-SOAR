title: RC4 Usage in Process Memory
id: a1000010-0023-4000-8000-000000000023
description: Detects RC4 cryptographic algorithm usage in process memory, commonly used by malware for encrypting C2 traffic
references:
    - https://attack.mitre.org/techniques/T1573/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.command_and_control
    - attack.t1573.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_api:
        Api|contains:
            - 'CryptAcquireContext'
            - 'CryptGenKey'
            - 'CryptEncrypt'
            - 'CryptDecrypt'
        Algorithm|contains:
            - 'CALG_RC4'
            - '0x6801'
    selection_memory:
        image_name: '*.exe'
        memory_string|contains:
            - 'RC4'
            - 'stream cipher'
    condition: selection_api or selection_memory
falsepositives:
    - Legacy applications using RC4 for compatibility
    - TLS libraries with RC4 fallback support
    - VPN clients using older protocols
level: high
