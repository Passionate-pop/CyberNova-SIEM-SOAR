title: Custom Encryption Implementation Detected
id: a1000010-0024-4000-8000-000000000024
description: Detects processes employing custom encryption or obfuscation routines in memory, typical of custom C2 protocol implementations
references:
    - https://attack.mitre.org/techniques/T1573/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.command_and_control
    - attack.t1573.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_xor:
        Api|contains:
            - 'VirtualAlloc'
            - 'VirtualProtect'
            - 'WriteProcessMemory'
        memory_string|contains:
            - 'xor'
            - 'XOR'
            - '0x'
    selection_entropy:
        section_entropy|gte: 7.5
        section_name|contains:
            - '.text'
            - '.data'
    condition: selection_xor and selection_entropy
falsepositives:
    - Legitimate software protection packers
    - Anti-tampering mechanisms in DRM
    - Code obfuscation in commercial software
level: medium
