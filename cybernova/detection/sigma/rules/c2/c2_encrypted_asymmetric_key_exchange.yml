title: Embedded Public Key in Binary
id: a1000010-0025-4000-8000-000000000025
description: Detects embedded RSA or ECDSA public keys within executable binaries, often used by C2 malware for secure communications
references:
    - https://attack.mitre.org/techniques/T1573/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.command_and_control
    - attack.t1573.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_rsa:
        memory_string|contains:
            - '-----BEGIN PUBLIC KEY-----'
            - '-----BEGIN RSA PUBLIC KEY-----'
            - '-----BEGIN CERTIFICATE-----'
            - 'MII'
            - 'ssh-rsa'
    selection_key_size:
        binary_string_length|gte: 512
        binary_entropy|gte: 6.0
    condition: selection_rsa and selection_key_size
falsepositives:
    - Software containing embedded certificates
    - SSH clients with hardcoded host keys
    - Application license verification
level: high
