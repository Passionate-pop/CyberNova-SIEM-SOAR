title: Suspicious CLI Commands on Network Devices
id: a1000002-0018-4000-8000-000000000018
description: Detects suspicious command-line interface commands on network devices commonly used for reconnaissance or backdoor installation
references:
    - https://attack.mitre.org/techniques/T1059/008/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059.008
logsource:
    category: process_creation
    product: linux
detection:
    selection_recon:
        CommandLine|contains:
            - 'show running-config'
            - 'show startup-config'
            - 'show vlan'
            - 'show ip route'
            - 'show ip arp'
            - 'show cdp neighbors'
            - 'show lldp neighbors'
            - 'debug ip'
    selection_backdoor:
        CommandLine|contains:
            - 'username * privilege 15'
            - 'enable secret'
            - 'ip http server'
            - 'ip http secure-server'
            - 'no logging'
            - 'no snmp-server'
    condition: 1 of selection_*
falsepositives:
    - Legitimate network administrator troubleshooting and configuration
    - Automated network discovery tools
level: medium
