title: PowerShell Remote PS Session
id: a1000002-0006-4000-8000-000000000006
description: Detects creation of PowerShell remote sessions via New-PSSession or Enter-PSSession
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_new:
        CommandLine|contains:
            - 'New-PSSession'
            - 'Enter-PSSession'
            - 'Invoke-Command'
    selection_remote:
        CommandLine|contains:
            - '-ComputerName'
            - '-Session'
            - '-ConnectionUri'
    condition: all of selection_*
falsepositives:
    - Legitimate system administration and remote management
    - IT support tools connecting to remote hosts
level: medium
