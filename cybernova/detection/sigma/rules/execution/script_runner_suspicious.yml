title: Suspicious Script Host Executable Execution
id: a1000002-0019-4000-8000-000000000019
description: Detects execution of suspicious script host executables (wscript, cscript, mshta) from unusual locations
references:
    - https://attack.mitre.org/techniques/T1059/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059
logsource:
    category: process_creation
    product: windows
detection:
    selection_hosts:
        Image|endswith:
            - \wscript.exe
            - \cscript.exe
            - \mshta.exe
    selection_parent:
        ParentImage|endswith:
            - \WINWORD.EXE
            - \EXCEL.EXE
            - \POWERPNT.EXE
            - \OUTLOOK.EXE
            - \acrobat.exe
            - \acrord32.exe
            - \chrome.exe
            - \firefox.exe
            - \iexplore.exe
            - \explorer.exe
    condition: all of selection_*
falsepositives:
    - Legitimate scripts launched from Office or browser
    - User interaction with downloaded files
level: high
