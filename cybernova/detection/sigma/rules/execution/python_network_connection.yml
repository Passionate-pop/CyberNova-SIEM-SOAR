title: Python Making Outbound Network Connection
id: a1000002-0015-4000-8000-000000000015
description: Detects Python making outbound network connections, which may indicate data exfiltration or C2 communication
references:
    - https://attack.mitre.org/techniques/T1059/006/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059.006
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: \python.exe
        Initiated: 'true'
        DestinationPort:
            - 80
            - 443
            - 8080
            - 8443
    selection_suspicious:
        DestinationPort:
            - 1337
            - 4444
            - 5555
            - 8888
            - 9001
    condition: 1 of selection_*
falsepositives:
    - Legitimate Python applications needing network access (e.g., package installers, web apps)
    - pip install operations contacting PyPI
level: medium
