title: WMI Persistence via Permanent Event Consumer
id: a1000002-0031-4000-8000-000000000031
description: Detects creation of WMI permanent event consumers which can be used to establish persistence
references:
    - https://attack.mitre.org/techniques/T1047/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1047
logsource:
    category: process_creation
    product: windows
detection:
    selection_wmic:
        Image|endswith: \wmic.exe
        CommandLine|contains:
            - 'CommandLineEventConsumer'
            - 'ActiveScriptEventConsumer'
            - 'NTEventLogEventConsumer'
            - 'LogFileEventConsumer'
    selection_powershell:
        Image|endswith:
            - \powershell.exe
            - \pwsh.exe
        CommandLine|contains:
            - '__EventFilter'
            - '__EventConsumer'
            - 'CommandLineEventConsumer'
            - 'ActiveScriptEventConsumer'
            - 'Set-WmiInstance'
            - 'CreateInstance'
    selection_consumer_creation:
        CommandLine|contains:
            - 'create'
            - 'put'
            - 'Set-WmiInstance'
    condition: all of selection_*
falsepositives:
    - Legitimate WMI-based monitoring and management solutions
    - Enterprise software using WMI for event-driven responses
level: high
