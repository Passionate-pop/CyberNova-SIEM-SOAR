title: LOLBin Script Execution
id: a1000002-0020-4000-8000-000000000020
description: Detects Living-Off-the-Land binaries (LOLBins) used to execute scripts including rundll32, regsvr32, and msiexec
references:
    - https://attack.mitre.org/techniques/T1059/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059
logsource:
    category: process_creation
    product: windows
detection:
    selection_rundll32:
        Image|endswith: \rundll32.exe
        CommandLine|contains:
            - 'javascript:'
            - 'http://'
            - 'https://'
            - '.dll,'
    selection_regsvr32:
        Image|endswith: \regsvr32.exe
        CommandLine|contains:
            - '/s'
            - '/u'
            - '/i:http'
            - 'scrobj.dll'
    selection_msiexec:
        Image|endswith: \msiexec.exe
        CommandLine|contains:
            - '/q'
            - '/i http'
            - '/i https'
            - 'http://'
            - 'https://'
    selection_mshta:
        Image|endswith: \mshta.exe
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - 'javascript:'
            - 'vbscript:'
    condition: 1 of selection_*
falsepositives:
    - Legitimate software installation via msiexec
    - Some enterprise web applications using these binaries
level: high
