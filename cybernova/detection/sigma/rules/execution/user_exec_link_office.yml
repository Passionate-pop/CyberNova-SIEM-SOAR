title: User Executes Malicious Link in Office Application
id: a1000002-0021-4000-8000-000000000021
description: Detects a user clicking a malicious link in Office applications that spawns a browser or script host
references:
    - https://attack.mitre.org/techniques/T1204/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1204.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith:
            - \WINWORD.EXE
            - \EXCEL.EXE
            - \POWERPNT.EXE
            - \OUTLOOK.EXE
        Image|endswith:
            - \chrome.exe
            - \firefox.exe
            - \iexplore.exe
            - \msedge.exe
            - \opera.exe
        CommandLine|contains:
            - 'http://'
            - 'https://'
    condition: selection
falsepositives:
    - Legitimate links clicked in Office documents
    - Embedded hyperlinks in corporate documents
level: medium
