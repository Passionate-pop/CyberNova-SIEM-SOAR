title: WMI Remote Process Creation
id: a1000002-0030-4000-8000-000000000030
description: Detects remote process creation via WMI using Win32_Process.Create with the /node flag or -ComputerName parameter
references:
    - https://attack.mitre.org/techniques/T1047/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1047
logsource:
    category: process_creation
    product: windows
detection:
    selection_wmic_remote:
        Image|endswith: \wmic.exe
        CommandLine|contains:
            - '/node:'
            - 'process call create'
    selection_powershell_remote:
        Image|endswith:
            - \powershell.exe
            - \pwsh.exe
        CommandLine|contains:
            - 'Invoke-WmiMethod'
            - 'Invoke-CimMethod'
            - '-ComputerName'
            - 'Win32_Process'
    condition: 1 of selection_*
falsepositives:
    - Legitimate enterprise remote administration tools
    - IT support and monitoring software
level: high
