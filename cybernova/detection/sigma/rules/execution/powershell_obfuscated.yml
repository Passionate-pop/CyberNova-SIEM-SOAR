title: PowerShell Obfuscated Command
id: a1000002-0003-4000-8000-000000000003
description: Detects heavily obfuscated PowerShell commands with excessive special characters, backticks, or string splitting
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - \powershell.exe
            - \pwsh.exe
    filter_obfuscation_high_special_chars:
        CommandLine|re: '(?:[^a-zA-Z0-9\s]{5,}.*){2,}'
    filter_obfuscation_backtick:
        CommandLine|contains: '`'
    filter_obfuscation_split:
        CommandLine|contains:
            - "';'"
            - "'+'"
            - " -f "
            - '$([ChaR]'
            - '[StrIng]::Join'
    condition: selection and (1 of filter_obfuscation_*)
falsepositives:
    - Legitimate scripts using obfuscation for intellectual property protection
level: high
