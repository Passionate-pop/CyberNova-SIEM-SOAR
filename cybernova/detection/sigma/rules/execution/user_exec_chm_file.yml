title: CHM File Execution
id: a1000002-0028-4000-8000-000000000028
description: Detects execution of Compiled HTML Help (CHM) files which can contain embedded scripts for code execution
references:
    - https://attack.mitre.org/techniques/T1204/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_chm_open:
        Image|endswith: \hh.exe
        CommandLine|contains:
            - '.chm'
    selection_chm_child:
        ParentImage|endswith: \hh.exe
        Image|endswith:
            - \cmd.exe
            - \powershell.exe
            - \wscript.exe
            - \cscript.exe
            - \mshta.exe
            - \rundll32.exe
    selection_chm_source:
        Image|endswith: \hh.exe
        CommandLine|contains:
            - '\Temp\'
            - '\Downloads\'
            - '\AppData\Roaming\'
            - '\Users\Public\'
    condition: 1 of selection_*
falsepositives:
    - Legitimate CHM help files opened from trusted sources
    - Software documentation
level: high
