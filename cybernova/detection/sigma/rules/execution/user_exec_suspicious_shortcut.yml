title: Suspicious LNK File Execution
id: a1000002-0023-4000-8000-000000000023
description: Detects execution of LNK shortcut files from suspicious locations or with unusual characteristics
references:
    - https://attack.mitre.org/techniques/T1204/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1204.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_suspicious_path:
        Image|endswith: \explorer.exe
        CommandLine|contains:
            - '\Temp\'
            - '\Downloads\'
            - '\AppData\Roaming\'
            - '\Users\Public\'
            - '\Desktop\'
            - '.lnk'
    selection_suspicious_args:
        CommandLine|contains:
            - 'powershell'
            - 'cmd /c'
            - 'mshta'
            - 'rundll32'
            - 'regsvr32'
            - 'wscript'
            - 'cscript'
    condition: all of selection_*
falsepositives:
    - Legitimate shortcuts on desktop or in downloads folder
    - User-created shortcuts
level: high
