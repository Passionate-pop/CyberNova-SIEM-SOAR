title: WMI Lateral Movement
id: a1000002-0035-4000-8000-000000000035
description: Detects WMI being used for lateral movement by creating remote processes or services on target systems
references:
    - https://attack.mitre.org/techniques/T1047/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1047
logsource:
    category: process_creation
    product: windows
detection:
    selection_remote_wmic_creds:
        Image|endswith: \wmic.exe
        CommandLine|contains:
            - '/node:'
            - '/user:'
            - '/password:'
    selection_remote_wmic_action:
        CommandLine|contains:
            - 'process call create'
            - 'service call create'
    selection_remote_powershell_methods:
        Image|endswith:
            - \powershell.exe
            - \pwsh.exe
        CommandLine|contains:
            - 'Invoke-WmiMethod'
            - 'Invoke-CimMethod'
    selection_remote_powershell_target:
        CommandLine|contains:
            - '-ComputerName'
            - '-Credential'
    selection_remote_powershell_create:
        CommandLine|contains:
            - 'Win32_Process.Create'
            - "Create').Invoke"
    condition: 1 of selection_*
falsepositives:
    - Legitimate enterprise remote management and administration
    - IT support teams using WMI for remote task execution
level: critical
