title: PowerShell Download Cradle
id: a1000002-0002-4000-8000-000000000002
description: Detects PowerShell commands used to download and execute payloads from remote sources
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - \powershell.exe
            - \pwsh.exe
        CommandLine|contains:
            - 'Invoke-WebRequest'
            - 'Invoke-RestMethod'
            - 'IEX '
            - 'iex '
            - 'IEX('
            - 'iex('
            - 'DownloadString'
            - 'DownloadFile'
            - 'Start-BitsTransfer'
            - 'Net.WebClient'
            - 'Net.HttpWebRequest'
    condition: selection
falsepositives:
    - Legitimate PowerShell scripts downloading modules or updates
    - Package managers like PSGallery
level: high
