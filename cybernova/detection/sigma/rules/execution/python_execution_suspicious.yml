title: Python Execution from Suspicious Location
id: a1000002-0014-4000-8000-000000000014
description: Detects Python execution from temp directories, user profile paths, or unusual locations
references:
    - https://attack.mitre.org/techniques/T1059/006/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059.006
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: \python.exe
        CommandLine|contains:
            - '\AppData\Local\Temp\'
            - '\Temp\'
            - '\Users\*\AppData\Roaming\'
            - '\Users\*\Desktop\'
            - '\Users\*\Downloads\'
            - 'C:\Users\*\'
    condition: selection
falsepositives:
    - Legitimate Python scripts installed by users in their profile
    - Development environments running from user directories
level: medium
