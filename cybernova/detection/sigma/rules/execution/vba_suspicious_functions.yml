title: VBA Suspicious Function Calls
id: a1000002-0012-4000-8000-000000000012
description: Detects VBA macros calling Windows API functions, Shell functions, or other suspicious Win32 API calls
references:
    - https://attack.mitre.org/techniques/T1059/005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - \WINWORD.EXE
            - \EXCEL.EXE
            - \POWERPNT.EXE
        CommandLine|contains:
            - 'Shell('
            - 'CreateObject'
            - 'WScript.Shell'
            - 'Shell.Application'
            - 'ADODB.Stream'
            - 'MSXML2.XMLHTTP'
            - 'WinHttp.WinHttpRequest'
            - 'URLDownloadToFile'
            - 'CallWindowProc'
            - 'RtlMoveMemory'
            - 'WriteProcessMemory'
            - 'CreateRemoteThread'
            - 'VirtualAlloc'
            - 'GetProcAddress'
            - 'LoadLibrary'
    condition: selection
falsepositives:
    - Legitimate advanced VBA macros for file operations or network access
level: high
