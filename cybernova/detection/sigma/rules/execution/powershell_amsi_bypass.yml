title: PowerShell AMSI Bypass Attempt
id: a1000002-0005-4000-8000-000000000005
description: Detects attempts to bypass the Anti-Malware Scan Interface (AMSI) in PowerShell
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - \powershell.exe
            - \pwsh.exe
        CommandLine|contains:
            - 'System.Management.Automation.AmsiUtils'
            - 'amsiInitFailed'
            - 'Disable-Amsi'
            - 'Bypass-Amsi'
            - '[Ref].Assembly.GetType'
            - 'AmsiScanBuffer'
            - 'amsi.dll'
            - 'etw::SamplingProfiler'
            - 'EventSizeError'
            - 'EventSizeTooBig'
            - 'EventSizeMismatch'
    condition: selection
falsepositives:
    - Legitimate security testing tools
    - Some advanced administrative scripts
level: critical
