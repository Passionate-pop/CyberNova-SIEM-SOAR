title: JS Dropper ActiveX and File Write Patterns
id: a1000002-0017-4000-8000-000000000017
description: Detects JavaScript with suspicious ActiveX objects and file write operations commonly used in droppers
references:
    - https://attack.mitre.org/techniques/T1059/007/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059.007
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - \wscript.exe
            - \cscript.exe
        CommandLine|contains:
            - 'ActiveXObject'
            - 'WScript.Shell'
            - 'Scripting.FileSystemObject'
            - 'ADODB.Stream'
            - 'XMLHTTP'
            - 'WinHttp'
            - 'Shell.Application'
            - 'Write('
            - 'WriteLine('
            - 'SaveToFile'
            - 'CreateTextFile'
            - 'OpenTextFile'
            - 'CopyFile'
            - 'MoveFile'
    condition: selection
falsepositives:
    - Legitimate administrative scripts using ActiveX for file operations
level: high
