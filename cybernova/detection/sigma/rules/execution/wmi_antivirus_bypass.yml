title: WMI Used to Disable or Tamper Antivirus
id: a1000002-0034-4000-8000-000000000034
description: Detects WMI commands used to disable, stop, or tamper with antivirus and security products
references:
    - https://attack.mitre.org/techniques/T1047/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1047
logsource:
    category: process_creation
    product: windows
detection:
    selection_wmi:
        Image|endswith:
            - \wmic.exe
            - \powershell.exe
            - \pwsh.exe
        CommandLine|contains:
            - 'AntivirusProduct'
            - 'FirewallProduct'
            - 'SecurityCenter'
    selection_disable:
        CommandLine|contains:
            - 'delete'
            - 'stop'
            - 'disable'
            - 'uninstall'
            - 'remove'
            - 'terminate'
    selection_service:
        CommandLine|contains:
            - 'Win32_Service'
            - 'Win32_Process'
            - 'Win32_Product'
    selection_service_target:
        CommandLine|contains:
            - 'WinDefend'
            - 'MsMpEng'
            - 'Sense'
            - 'SecurityHealth'
            - 'windefend'
            - 'defender'
            - 'symantec'
            - 'mcafee'
            - 'crowdstrike'
            - 'carbonblack'
            - 'sentinel'
    condition: 1 of selection_*
falsepositives:
    - Legitimate IT administration disabling AV for troubleshooting
    - Software installation requiring AV temporarily disabled
level: critical
