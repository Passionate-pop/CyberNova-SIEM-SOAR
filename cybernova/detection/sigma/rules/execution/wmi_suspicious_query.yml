title: WMI Querying Sensitive Data
id: a1000002-0033-4000-8000-000000000033
description: Detects WMI queries targeting sensitive information such as credentials, security products, or system configurations
references:
    - https://attack.mitre.org/techniques/T1047/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1047
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        Image|endswith:
            - \wmic.exe
            - \powershell.exe
            - \pwsh.exe
    selection_queries:
        CommandLine|contains:
            - 'AntivirusProduct'
            - 'FirewallProduct'
            - 'AntiSpywareProduct'
            - 'SecurityCenter'
            - 'Sysdriver'
            - 'Protected'
            - 'select * from win32_service'
            - 'select * from win32_process'
            - 'select * from win32_useraccount'
            - 'select * from win32_computersystem'
            - 'select * from win32_networkadapter'
            - 'select * from win32_networkconnection'
            - 'select * from win32_logicaldisk'
            - 'select * from win32_share'
            - 'select * from win32_startupcommand'
    condition: all of selection_*
falsepositives:
    - Legitimate system inventory and asset management tools
    - Security auditing and compliance scanning software
level: medium
