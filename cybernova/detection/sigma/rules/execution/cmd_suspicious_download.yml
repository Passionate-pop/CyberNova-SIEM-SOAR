title: CMD Suspicious Download Activity
id: a1000002-0010-4000-8000-000000000010
description: Detects use of built-in Windows tools like certutil, curl, and bitsadmin to download files via cmd.exe
references:
    - https://attack.mitre.org/techniques/T1059/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_certutil:
        Image|endswith: \certutil.exe
        CommandLine|contains:
            - '-urlcache'
            - '-split'
            - '-f'
    selection_curl:
        Image|endswith: \curl.exe
        CommandLine|contains:
            - '-o '
            - '--output '
            - '>'
    selection_bitsadmin:
        Image|endswith: \bitsadmin.exe
        CommandLine|contains:
            - '/transfer'
            - '/download'
            - '/addfile'
    condition: 1 of selection_*
falsepositives:
    - Legitimate use of these tools for file transfers by IT staff
    - Automated update processes
level: medium
