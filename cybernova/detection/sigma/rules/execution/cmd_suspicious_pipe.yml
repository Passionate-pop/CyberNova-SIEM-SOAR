title: CMD Suspicious Named Pipe Redirection
id: a1000002-0008-4000-8000-000000000008
description: Detects cmd.exe using named pipe redirection, commonly used for lateral movement and data exfiltration
references:
    - https://attack.mitre.org/techniques/T1059/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: \cmd.exe
        CommandLine|contains:
            - '\\.\pipe\'
            - '\\.\\pipe\\'
            - '> \\.\pipe\'
            - '< \\.\pipe\'
    condition: selection
falsepositives:
    - Legitimate inter-process communication via named pipes
    - Some backup or logging software using pipes
level: medium
