title: Office Macro Execution
id: a1000002-0011-4000-8000-000000000011
description: Detects execution of VBA macros in Microsoft Office applications
references:
    - https://attack.mitre.org/techniques/T1059/005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - \WINWORD.EXE
            - \EXCEL.EXE
            - \POWERPNT.EXE
            - \OUTLOOK.EXE
            - \MSPUB.EXE
            - \VISIO.EXE
        CommandLine|contains:
            - '/Automation'
            - '/Embedding'
    selection_child:
        ParentImage|endswith:
            - \WINWORD.EXE
            - \EXCEL.EXE
            - \POWERPNT.EXE
            - \OUTLOOK.EXE
        Image|endswith:
            - \cmd.exe
            - \powershell.exe
            - \pwsh.exe
            - \wscript.exe
            - \cscript.exe
            - \mshta.exe
            - \regsvr32.exe
    condition: 1 of selection_*
falsepositives:
    - Legitimate macros used in corporate environments
    - Document automation and add-ins
level: high
