title: WMI Persistence via Event Filter
id: a1000002-0032-4000-8000-000000000032
description: Detects creation of WMI event filters which can be combined with consumers for persistence
references:
    - https://attack.mitre.org/techniques/T1047/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1047
logsource:
    category: process_creation
    product: windows
detection:
    selection_wmi_event:
        Image|endswith:
            - \wmic.exe
            - \powershell.exe
            - \pwsh.exe
        CommandLine|contains:
            - '__EventFilter'
            - 'MSFT_WmiEventFilter'
            - 'WMIEventFilter'
    selection_filter_create_action:
        CommandLine|contains:
            - 'create'
            - 'put'
            - 'Set-WmiInstance'
            - 'New-CimInstance'
    selection_filter_create_target:
        CommandLine|contains:
            - 'Filter'
            - 'EventFilter'
    selection_trigger:
        CommandLine|contains:
            - 'TimerInstruction'
            - '__TimerEvent'
            - 'ProcessStartTrace'
            - 'ProcessStopTrace'
            - 'ModuleLoadTrace'
            - 'ThreadStartTrace'
    condition: 1 of selection_*
falsepositives:
    - Legitimate WMI-based monitoring solutions
    - IT management software creating performance monitors
level: high
