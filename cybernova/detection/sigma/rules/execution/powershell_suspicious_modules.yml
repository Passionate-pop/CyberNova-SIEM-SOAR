title: PowerShell Suspicious Module Loading
id: a1000002-0004-4000-8000-000000000004
description: Detects PowerShell loading known offensive security modules such as Invoke-Mimikatz, Invoke-AtomicRedTeam, etc.
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - \powershell.exe
            - \pwsh.exe
        CommandLine|contains:
            - 'Invoke-Mimikatz'
            - 'Invoke-DumpCred'
            - 'Invoke-TokenManipulation'
            - 'Invoke-ReflectivePEInjection'
            - 'Invoke-Shellcode'
            - 'Invoke-WmiCommand'
            - 'Out-Minidump'
            - 'Get-Keystrokes'
            - 'Invoke-Phant0m'
            - 'Invoke-CredentialInjection'
            - 'import-module'
    condition: selection
falsepositives:
    - Security researchers and penetration testers running authorized tests
    - Legitimate credential auditing tools
level: critical
