title: File with Double Extension Executed
id: a1000002-0027-4000-8000-000000000027
description: Detects execution of files with double extensions (e.g., invoice.pdf.exe) commonly used to trick users
references:
    - https://attack.mitre.org/techniques/T1204/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '.exe'
            - '.scr'
            - '.msi'
            - '.bat'
            - '.com'
            - '.pif'
        Image|contains:
            - '.pdf.'
            - '.doc.'
            - '.docx.'
            - '.xls.'
            - '.xlsx.'
            - '.ppt.'
            - '.pptx.'
            - '.txt.'
            - '.jpg.'
            - '.jpeg.'
            - '.png.'
            - '.gif.'
            - '.zip.'
            - '.rar.'
            - '.7z.'
    condition: selection
falsepositives:
    - Very rare legitimate files with double extensions
level: critical
