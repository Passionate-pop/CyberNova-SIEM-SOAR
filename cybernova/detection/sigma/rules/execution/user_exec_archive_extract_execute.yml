title: Archive Extracted Then File Executed
id: a1000002-0026-4000-8000-000000000026
description: Detects a file being extracted from an archive and then quickly executed, common in malware delivery
references:
    - https://attack.mitre.org/techniques/T1204/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_archive_tool:
        Image|endswith:
            - \7z.exe
            - \7zG.exe
            - \WinRAR.exe
            - \winzip.exe
            - \WinRAR64.exe
            - \UnRAR.exe
            - \powershell.exe
        CommandLine|contains:
            - ' x '
            - ' e '
            - 'Extract'
            - 'Expand-Archive'
    selection_execution:
        Image|endswith:
            - \cmd.exe
            - \powershell.exe
            - \pwsh.exe
            - \wscript.exe
            - \cscript.exe
            - \mshta.exe
            - \rundll32.exe
            - \regsvr32.exe
        ParentImage|endswith:
            - \explorer.exe
    condition: all of selection_*
falsepositives:
    - User extracting and running legitimate software from archive
    - Software installations from archives
level: high
