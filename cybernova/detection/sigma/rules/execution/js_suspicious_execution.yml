title: JavaScript Execution via WScript/CScript
id: a1000002-0016-4000-8000-000000000016
description: Detects JavaScript or JScript file execution via Windows Script Host (wscript.exe or cscript.exe)
references:
    - https://attack.mitre.org/techniques/T1059/007/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059.007
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - \wscript.exe
            - \cscript.exe
        CommandLine|contains:
            - '.js'
            - '.jse'
            - '.jscript'
            - '.vbs'
            - '.vbe'
    selection_extension:
        CommandLine|endswith:
            - '.js'
            - '.jse'
    selection_suspicious_paths:
        CommandLine|contains:
            - '\Temp\'
            - '\Downloads\'
            - '\AppData\Roaming\'
            - '\Users\Public\'
    condition: all of selection_*
falsepositives:
    - Legitimate JavaScript automation scripts
    - Corporate logon scripts
level: high
