title: CMD Suspicious Commands
id: a1000002-0007-4000-8000-000000000007
description: Detects suspicious commands executed via cmd.exe commonly used in post-exploitation scenarios
references:
    - https://attack.mitre.org/techniques/T1059/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: \cmd.exe
        CommandLine|contains:
            - 'net user'
            - 'net localgroup'
            - 'net group'
            - 'pwdump'
            - 'samdump'
            - 'wmic useraccount'
            - 'wmic process'
            - 'whoami'
            - 'systeminfo'
            - 'ipconfig /displaydns'
            - 'netshell dump'
            - 'vssadmin'
            - 'bcdedit'
            - 'reg save hklm'
            - 'taskkill /f /im'
            - 'wevtutil cl'
            - 'fsutil'
    condition: selection
falsepositives:
    - IT administration and troubleshooting scripts
    - Automated inventory and monitoring tools
level: high
