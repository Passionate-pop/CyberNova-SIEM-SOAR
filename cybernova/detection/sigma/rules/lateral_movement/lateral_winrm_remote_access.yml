title: WinRM Remote PowerShell Execution
id: a1000008-0016-4000-8000-000000000016
description: Detects remote PowerShell execution via WinRM using Invoke-Command, Enter-PSSession, or New-PSSession targeting remote hosts
references:
    - https://attack.mitre.org/techniques/T1021/006/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1021.006
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - \powershell.exe
            - \pwsh.exe
        CommandLine|contains:
            - 'Invoke-Command'
            - 'Enter-PSSession'
            - 'New-PSSession'
            - '-ComputerName'
            - '-SessionOption'
    condition: selection
falsepositives:
    - Legitimate PowerShell remoting used by system administrators
    - Automated deployment and configuration management tools
level: high
