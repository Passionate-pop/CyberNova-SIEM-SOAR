title: Legitimate File Overwritten On Network Share
id: a1000008-0020-4000-8000-000000000020
description: Detects when existing legitimate files on network shares are modified or overwritten, which may indicate adversaries replacing trusted files with malicious versions
references:
    - https://attack.mitre.org/techniques/T1080/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1080.001
logsource:
    category: file_event
    product: windows
detection:
    selection:
        EventID: 4663
        ObjectType: 'File'
        AccessMask: '0x2'
        ShareName|contains:
            - 'ADMIN$'
            - 'C$'
            - 'SYSVOL'
            - 'NETLOGON'
    condition: selection
falsepositives:
    - Authorized administrators updating scripts or binaries
    - Group Policy updates modifying startup scripts
level: medium
