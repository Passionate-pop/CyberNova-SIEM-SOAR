title: SMB Admin Share Access ADMIN$ C$
id: a1000008-0006-4000-8000-000000000006
description: Detects access to SMB administrative shares (ADMIN$, C$, D$) which are commonly used by adversaries for lateral movement to deploy tools or access files
references:
    - https://attack.mitre.org/techniques/T1021/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1021.002
logsource:
    category: share_access
    product: windows
detection:
    selection:
        EventID: 5140
        ShareName|contains:
            - 'ADMIN$'
            - 'C$'
            - 'D$'
    condition: selection
falsepositives:
    - Legitimate system administration via remote management tools
    - Group Policy processing accessing SYSVOL or NETLOGON
    - Enterprise backup software accessing admin shares
level: high
