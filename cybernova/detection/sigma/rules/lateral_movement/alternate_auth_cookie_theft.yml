title: Web Session Cookie Theft Reuse Detected
id: a1000008-0030-4000-8000-000000000030
description: Detects web session cookies being accessed, stolen, or reused from a different IP address or user agent, indicating possible session cookie theft and lateral movement via web applications
references:
    - https://attack.mitre.org/techniques/T1550/004/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1550.004
logsource:
    category: process_creation
    product: windows
detection:
    selection_browser:
        Image|endswith:
            - \chrome.exe
            - \msedge.exe
            - \firefox.exe
        CommandLine|contains:
            - '--user-data-dir'
            - '-profile'
            - '--cookie'
    selection_extraction:
        Image|endswith:
            - \powershell.exe
            - \pwsh.exe
        CommandLine|contains:
            - 'cookies'
            - 'session'
            - '.dat'
            - 'Cookies'
    condition: 1 of selection_*
falsepositives:
    - Legitimate browser profile management
    - Web development and debugging activities
level: medium
