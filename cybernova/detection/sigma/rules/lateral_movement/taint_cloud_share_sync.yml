title: Cloud File Share Synced With Malicious Content
id: a1000008-0025-4000-8000-000000000025
description: Detects cloud file synchronization (OneDrive, Google Drive, Dropbox) being used to sync malicious content from a compromised cloud share to multiple endpoints
references:
    - https://attack.mitre.org/techniques/T1080/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1080.003
logsource:
    category: file_event
    product: windows
detection:
    selection_process:
        Image|endswith:
            - \OneDrive.exe
            - \GoogleDriveFS.exe
            - \Dropbox.exe
    selection_file_creation:
        TargetFilename|endswith:
            - '.exe'
            - '.dll'
            - '.ps1'
            - '.js'
            - '.vbs'
    condition: selection_process and selection_file_creation
falsepositives:
    - IT administrators deploying software via cloud sync
    - Users syncing legitimate work files from cloud storage
level: medium
