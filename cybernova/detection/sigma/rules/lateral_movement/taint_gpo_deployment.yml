title: Malicious GPO Startup Logon Script Deployment
id: a1000008-0022-4000-8000-000000000022
description: Detects modifications to Group Policy Objects that add or modify startup/logon scripts, which adversaries may use to deploy malicious code to multiple systems simultaneously
references:
    - https://attack.mitre.org/techniques/T1080/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1080.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_gpupdate:
        Image|endswith: \gpupdate.exe
    selection_gppref:
        Image|endswith: \powershell.exe
        CommandLine|contains:
            - 'Set-GPPrefRegistryValue'
            - 'New-GPO'
            - 'Set-GPO'
    selection_sysvol:
        TargetFilename|contains:
            - 'SYSVOL'
            - 'Policies'
            - 'scripts.ini'
            - 'gpt.ini'
    condition: 1 of selection_*
falsepositives:
    - Authorized Group Policy administrators updating policies
    - Enterprise configuration management tools
level: high
