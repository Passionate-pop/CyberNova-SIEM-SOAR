title: SMB Remote Service Control svcctl
id: a1000008-0007-4000-8000-000000000007
description: Detects remote service creation or modification via SMB named pipe (svcctl) which is used by tools like PsExec to execute commands on remote systems
references:
    - https://attack.mitre.org/techniques/T1021/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1021.002
logsource:
    category: pipe_creation
    product: windows
detection:
    selection:
        PipeName: 'svcctl'
    condition: selection
falsepositives:
    - System Center Configuration Manager (SCCM) remote administration
    - Enterprise endpoint management tools
level: high
