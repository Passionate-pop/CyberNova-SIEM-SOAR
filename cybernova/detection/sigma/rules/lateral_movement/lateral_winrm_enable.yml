title: WinRM Service Enabled Configured
id: a1000008-0015-4000-8000-000000000015
description: Detects the enabling or configuration of Windows Remote Management (WinRM) service, which may be enabled by adversaries to establish remote access for lateral movement
references:
    - https://attack.mitre.org/techniques/T1021/006/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1021.006
logsource:
    category: registry_event
    product: windows
detection:
    selection_winrm_reg:
        EventType: 'SetValue'
        TargetObject|contains:
            - 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\WSMAN'
            - 'HKLM\SYSTEM\CurrentControlSet\Services\WinRM'
    selection_service_start:
        EventID: 7036
        ServiceName: 'WinRM'
        ServiceState: 'running'
    condition: 1 of selection_*
falsepositives:
    - System administrators enabling WinRM for legitimate remote management
    - Domain Group Policy configuring WinRM settings
level: medium
