title: DCOM MMC20 Application Lateral Movement
id: a1000008-0010-4000-8000-000000000010
description: Detects lateral movement via DCOM using the MMC20.Application COM object, which can be abused to execute arbitrary code on remote systems
references:
    - https://attack.mitre.org/techniques/T1021/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1021.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: \mmc.exe
        ParentCommandLine|contains:
            - 'PowerShell'
            - 'Invoke-WmiMethod'
            - 'Invoke-CimMethod'
            - '-ComObject'
            - 'MMC20.Application'
            - 'Document.ActiveView'
            - 'ExecuteShellCommand'
    condition: selection
falsepositives:
    - Legitimate MMC console usage by administrators
    - Group Policy Management Console operations
level: high
