title: RDP Service TermService Started On Non-Server
id: a1000008-0004-4000-8000-000000000004
description: Detects the Remote Desktop Services (TermService) being started on workstations or non-server systems where RDP is not expected to be enabled
references:
    - https://attack.mitre.org/techniques/T1021/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1021.001
logsource:
    category: service_start
    product: windows
detection:
    selection:
        EventID: 7036
        ServiceName: 'TermService'
        ServiceState: 'running'
    condition: selection
falsepositives:
    - System administrators enabling RDP for legitimate remote troubleshooting
    - Enterprise deployment tools that configure RDP settings
level: medium
