title: SMB Execution Tools PsExec SMBExec Winexe
id: a1000008-0008-4000-8000-000000000008
description: Detects execution of known SMB-based lateral movement tools including PsExec, SMBExec, and Winexe via process creation or service installation artifacts
references:
    - https://attack.mitre.org/techniques/T1021/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1021.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_psexec:
        Image|endswith:
            - \PsExec.exe
            - \PsExec64.exe
        OriginalFileName: 'psexec.c'
    selection_smbexec:
        Image|endswith:
            - \smbexec.exe
            - \smbexec.py
    selection_winexe:
        Image|endswith:
            - \winexe.exe
            - \winexe64.exe
    condition: 1 of selection_*
falsepositives:
    - Authorized IT administration tools
    - Penetration testing in controlled environments
level: high
