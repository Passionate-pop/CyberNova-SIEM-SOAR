title: Suspicious SCCM PDQ Application Deployment
id: a1000008-0023-4000-8000-000000000023
description: Detects suspicious application deployments via enterprise management tools such as SCCM or PDQ that deploy unexpected software packages to multiple systems
references:
    - https://attack.mitre.org/techniques/T1080/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1080.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_sccm:
        Image|endswith:
            - \ccmsetup.exe
            - \ccmexec.exe
        ParentCommandLine|contains:
            - 'AdvertisementID'
            - 'PackageID'
    selection_pdq:
        Image|endswith:
            - \PDQDeploy.exe
            - \PDQDeploy64.exe
    condition: 1 of selection_*
falsepositives:
    - Scheduled maintenance deployments by IT teams
    - Emergency patch deployments
level: medium
