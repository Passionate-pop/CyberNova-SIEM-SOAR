title: RDP Credential Relay Man-in-the-Middle
id: a1000008-0018-4000-8000-000000000018
description: Detects indicators of RDP credential relay or man-in-the-middle attacks where an adversary intercepts and forwards RDP authentication to gain access to remote systems
references:
    - https://attack.mitre.org/techniques/T1021/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1021
logsource:
    category: network_connection
    product: windows
detection:
    selection_rdp_intermediate:
        EventID: 3
        Initiated: 'true'
        DestinationPort: 3389
        SourcePort|range:
            - 49152
            - 65535
    condition: selection_rdp_intermediate
falsepositives:
    - RDP gateway or Remote Desktop Services broker
    - Network address translation (NAT) devices
level: medium
