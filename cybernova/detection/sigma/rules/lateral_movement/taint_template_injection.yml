title: Suspicious Template Injection DOTM XLTM
id: a1000008-0024-4000-8000-000000000024
description: Detects template injection attacks where adversaries place malicious Office template files (dotm, xltm, potm) on network shares to trigger code execution when opened
references:
    - https://attack.mitre.org/techniques/T1080/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1080.003
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|endswith:
            - '.dotm'
            - '.xltm'
            - '.potm'
            - '.ppam'
            - '.xlam'
    condition: selection
falsepositives:
    - Authorized template deployment by enterprise IT
    - Users saving personal templates to shared drives
level: high
