title: SSH Connection From Unexpected Source
id: a1000008-0012-4000-8000-000000000012
description: Detects SSH connections originating from source IP addresses or hosts not part of the expected administrative or jump host pool
references:
    - https://attack.mitre.org/techniques/T1021/004/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1021.004
logsource:
    category: network_connection
    product: linux
detection:
    selection:
        DestinationPort: 22
        Initiated: 'true'
    condition: selection
falsepositives:
    - New legitimate administrative workstations
    - Dynamic infrastructure provisioning
level: medium
