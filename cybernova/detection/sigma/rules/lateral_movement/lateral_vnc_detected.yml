title: VNC Remote Desktop Connection Detected
id: a1000008-0014-4000-8000-000000000014
description: Detects VNC remote desktop connections which may be used by adversaries for lateral movement when native RDP is blocked or monitored
references:
    - https://attack.mitre.org/techniques/T1021/005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1021.005
logsource:
    category: network_connection
    product: windows
detection:
    selection_vnc_ports:
        DestinationPort:
            - 5900
            - 5901
            - 5902
            - 5903
            - 5800
        Initiated: 'true'
    selection_vnc_process:
        Image|endswith:
            - \vnc.exe
            - \vncserver.exe
            - \vncviewer.exe
            - \tightvnc.exe
            - \ultravnc.exe
    condition: 1 of selection_*
falsepositives:
    - Authorized remote support using VNC
    - Legacy applications that use VNC for screen sharing
level: medium
