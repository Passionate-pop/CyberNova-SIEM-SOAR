title: RDP Connection From Unexpected Source
id: a1000008-0001-4000-8000-000000000001
description: Detects Remote Desktop connections originating from IP addresses, hosts, or subnets not typically associated with RDP administration
references:
    - https://attack.mitre.org/techniques/T1021/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1021.001
logsource:
    category: network_connection
    product: windows
detection:
    selection_event:
        EventID: 3
    selection_rdp:
        Initiated: 'true'
        DestinationPort: 3389
    selection_unexpected:
        SourceIp|contains:
            - '10.0.0.'
            - '172.16.'
    condition: selection_event and selection_rdp and not selection_unexpected
falsepositives:
    - New IT administrator workstations
    - VPN connections from legitimate remote users
    - Dynamic IP ranges assigned to admin jump boxes
level: high
