title: Pass-the-Hash Via NTLM Tools Impacket
id: a1000008-0027-4000-8000-000000000027
description: Detects pass-the-hash attacks using NTLM-based tools such as NetExec (nxc), Impacket (wmiexec, smbexec, psexec), and similar frameworks that authenticate using NTLM hashes
references:
    - https://attack.mitre.org/techniques/T1550/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1550.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        Image|endswith:
            - \nxc.exe
            - \netexec.exe
            - \wmiexec.py
            - \smbexec.py
            - \psexec.py
            - \atexec.py
            - \dcomexec.py
    selection_flags:
        CommandLine|contains:
            - '-H'
            - '--hash'
            - '-hashes'
            - 'LM:'
            - 'NTLM:'
            - 'aad3b435b51404eeaad3b435b51404ee'
    condition: 1 of selection_tools and selection_flags
falsepositives:
    - Authorized penetration testing and red team exercises
    - Security tool validation in isolated environments
level: critical
