title: OAuth Token Reuse Stolen Token Detected
id: a1000008-0026-4000-8000-000000000026
description: Detects OAuth access or refresh tokens being used from an IP address or device different from the original authentication, indicating possible token theft and reuse
references:
    - https://attack.mitre.org/techniques/T1550/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.lateral_movement
    - attack.t1550.001
logsource:
    service: cloud_audit
    product: azure
detection:
    selection:
        eventName: 'Sign-in activity'
        Status: 'Success'
        AuthenticationRequirement: 'Single-factor authentication'
        TokenIssuerType: 'Azure AD'
    condition: selection
falsepositives:
    - Legitimate token refresh from roaming users
    - Token sharing between approved applications
level: high
