title: Timestomp via Touch or chmod Manipulation
id: a1000005-0041-4000-8000-000000000041
description: Detects timestomping on Linux using touch or chmod to alter file timestamps and conceal malicious activity.
references:
    - https://attack.mitre.org/techniques/T1070/006/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1070
    - attack.t1070.006
logsource:
    category: process_creation
    product: linux
detection:
    selection_touch:
        Image|endswith: '/touch'
        CommandLine|contains:
            - '-t'
            - '-r'
            - '-d'
    selection_chmod:
        Image|endswith: '/chmod'
        CommandLine|contains: '--reference'
    condition: selection_touch or selection_chmod
falsepositives:
    - Authorized file timestamp corrections
level: medium
