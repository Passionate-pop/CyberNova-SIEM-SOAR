title: Runtime Broker or Background Apps Disabled
id: a1000005-0056-4000-8000-000000000056
description: Detects when runtime broker or background application functionality is disabled via registry.
references:
    - https://attack.mitre.org/techniques/T1112/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1112
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\RuntimeBroker'
            - '\System\CurrentControlSet\Services\BrokerInfrastructure'
        EventType: SetValue
    condition: selection
falsepositives:
    - Authorized performance optimization in constrained environments
level: low
