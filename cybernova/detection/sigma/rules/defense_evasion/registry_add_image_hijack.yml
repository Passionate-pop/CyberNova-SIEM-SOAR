title: Image Hijack via Debugger or VerifierDlls
id: a1000005-0053-4000-8000-000000000053
description: Detects registry modifications that hijack executable images via Debugger key or VerifierDlls for persistence.
references:
    - https://attack.mitre.org/techniques/T1112/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1112
logsource:
    category: registry_set
    product: windows
detection:
    selection_debugger:
        TargetObject|contains:
            - '\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\'
        TargetObject|endswith: '\Debugger'
    selection_verifier:
        TargetObject|contains:
            - '\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\'
        TargetObject|endswith: '\VerifierDlls'
    condition: selection_debugger or selection_verifier
falsepositives:
    - Authorized debugging tools configuration by developers
level: high
