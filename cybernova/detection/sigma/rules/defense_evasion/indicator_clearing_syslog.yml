title: Syslog or Journald Log Removal
id: a1000005-0032-4000-8000-000000000032
description: Detects when syslog or journald logs are removed or truncated on Linux systems, covering T1070.002.
references:
    - https://attack.mitre.org/techniques/T1070/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1070
    - attack.t1070.002
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith:
            - '/rm'
            - '/journalctl'
        CommandLine|contains:
            - '/var/log/syslog'
            - '/var/log/messages'
            - '/var/log/journal'
            - '--rotate'
            - '--vacuum'
    condition: selection
falsepositives:
    - Authorized log rotation by system administrators
level: high
