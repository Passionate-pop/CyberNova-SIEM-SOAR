title: Antivirus Exclusion Added
id: a1000005-0003-4000-8000-000000000003
description: Detects when an exclusion path, process, or extension is added to Windows Defender or other AV, bypassing scanning.
references:
    - https://attack.mitre.org/techniques/T1562/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.001
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        EventType: SetValue
        TargetObject|contains:
            - '\Windows Defender\Exclusions\Paths'
            - '\Windows Defender\Exclusions\Processes'
            - '\Windows Defender\Exclusions\Extensions'
    condition: selection
falsepositives:
    - Administrator adding legitimate exclusions for performance-critical applications
level: medium
