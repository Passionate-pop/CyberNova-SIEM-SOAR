title: New Service Registered in Registry
id: a1000005-0052-4000-8000-000000000052
description: Detects when a new Windows service is registered via registry under the Services key, indicating persistence.
references:
    - https://attack.mitre.org/techniques/T1112/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1112
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\SYSTEM\CurrentControlSet\Services\'
    condition: selection
falsepositives:
    - Legitimate software installation registering new services
level: medium
