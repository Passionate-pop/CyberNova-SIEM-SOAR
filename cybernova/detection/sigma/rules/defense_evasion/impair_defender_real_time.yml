title: Windows Defender Real-Time Monitoring Disabled
id: a1000005-0005-4000-8000-000000000005
description: Detects when Windows Defender real-time monitoring is disabled via PowerShell, registry, or mpcmdrun.
references:
    - https://attack.mitre.org/techniques/T1562/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_powershell:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'Set-MpPreference'
            - 'DisableRealtimeMonitoring'
            - 'true'
    selection_mpcmdrun:
        Image|endswith: '\MpCmdRun.exe'
        CommandLine|contains: '-DisableRealtimeMonitoring'
    condition: selection_powershell or selection_mpcmdrun
falsepositives:
    - IT administrators disabling real-time monitoring for performance testing
level: high
