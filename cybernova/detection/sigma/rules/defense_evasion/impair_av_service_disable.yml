title: Antivirus or Security Service Set to Disabled
id: a1000005-0002-4000-8000-000000000002
description: Detects when an antivirus or security service startup type is set to disabled via registry or service control manager.
references:
    - https://attack.mitre.org/techniques/T1562/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.001
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        EventType: SetValue
        TargetObject|contains:
            - '\Services\WinDefend\Start'
            - '\Services\Sense\Start'
            - '\Services\MsMpEng\Start'
            - '\Services\McAfee\Start'
            - '\Services\Sophos\Start'
            - '\Services\Kaspersky\Start'
        Details: '4'
    condition: selection
falsepositives:
    - Legitimate IT-department disabling of AV for compatibility testing
level: high
