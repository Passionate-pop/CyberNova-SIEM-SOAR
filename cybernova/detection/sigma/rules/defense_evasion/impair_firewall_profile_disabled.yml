title: Firewall Profile Set to Disabled
id: a1000005-0015-4000-8000-000000000015
description: Detects when a firewall profile (Domain, Private, Public) is set to disabled, fully turning off the firewall.
references:
    - https://attack.mitre.org/techniques/T1562/004/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.004
logsource:
    category: process_creation
    product: windows
detection:
    selection_netsh:
        Image|endswith: '\netsh.exe'
        CommandLine|contains|all:
            - 'advfirewall'
            - 'set'
            - 'profile'
            - 'off'
    selection_reg:
        EventType: SetValue
        TargetObject|contains:
            - '\Services\SharedAccess\Parameters\FirewallPolicy\DomainProfile\EnableFirewall'
            - '\Services\SharedAccess\Parameters\FirewallPolicy\PublicProfile\EnableFirewall'
            - '\Services\SharedAccess\Parameters\FirewallPolicy\StandardProfile\EnableFirewall'
        Details: '0'
    condition: selection_netsh or selection_reg
falsepositives:
    - Authorized firewall profile change for network troubleshooting
level: high
