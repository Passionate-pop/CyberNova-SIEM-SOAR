title: Event Log Cleared via wevtutil
id: a1000005-0030-4000-8000-000000000030
description: Detects when Windows event logs are cleared using the wevtutil command-line tool.
references:
    - https://attack.mitre.org/techniques/T1070/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1070
    - attack.t1070.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\wevtutil.exe'
        CommandLine|contains|all:
            - 'cl'
            - 'Log'
    condition: selection
falsepositives:
    - Authorized event log clearing during forensic acquisition
level: high
