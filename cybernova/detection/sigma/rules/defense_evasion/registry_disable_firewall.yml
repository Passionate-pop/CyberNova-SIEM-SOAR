title: Disable Windows Firewall via Registry
id: a1000005-0049-4000-8000-000000000049
description: Detects registry modifications that disable Windows Firewall by setting EnableFirewall to 0.
references:
    - https://attack.mitre.org/techniques/T1112/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1112
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\EnableFirewall'
        Details: '0'
    condition: selection
falsepositives:
    - Authorized firewall configuration change by network administrators
level: high
