title: Mass File Deletion Event
id: a1000005-0037-4000-8000-000000000037
description: Detects mass file deletion events that may indicate an attempt to remove forensic evidence.
references:
    - https://attack.mitre.org/techniques/T1070/004/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1070
    - attack.t1070.004
logsource:
    category: file_event
    product: windows
detection:
    selection:
        EventID: 4663
        AccessMask: 'DELETE'
    selection_threshold:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\rm.exe'
    condition: selection and selection_threshold
falsepositives:
    - Authorized bulk file deletion during system cleanup
level: high
