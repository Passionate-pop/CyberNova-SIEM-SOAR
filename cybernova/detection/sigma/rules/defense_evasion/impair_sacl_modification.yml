title: SACL Modification to Disable Auditing
id: a1000005-0008-4000-8000-000000000008
description: Detects modification of SACL (System Access Control List) entries to disable auditing on critical system objects.
references:
    - https://attack.mitre.org/techniques/T1562/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.001
logsource:
    category: security
    product: windows
detection:
    selection:
        EventID: 4715
        AuditPolicyChanges|contains: 'removed'
    selection_sacl:
        EventID: 4719
        AuditSettingChange|contains: 'removed'
    condition: selection or selection_sacl
falsepositives:
    - Legitimate audit policy changes by security administrators
level: high
