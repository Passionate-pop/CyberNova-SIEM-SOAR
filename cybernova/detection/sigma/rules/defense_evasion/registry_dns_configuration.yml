title: DNS Server Configuration Modified via Registry
id: a1000005-0058-4000-8000-000000000058
description: Detects when DNS server configuration is modified via registry, potentially redirecting traffic through malicious DNS.
references:
    - https://attack.mitre.org/techniques/T1112/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1112
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\Tcpip\Parameters\NameServer'
            - '\Tcpip\Parameters\DhcpNameServer'
            - '\Tcpip\Parameters\Interfaces\'
        TargetObject|endswith: 'NameServer'
        EventType: SetValue
    condition: selection
falsepositives:
    - Authorized DNS configuration changes by network administrators
level: medium
