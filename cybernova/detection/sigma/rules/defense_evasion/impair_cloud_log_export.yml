title: Cloud Log Export or Delivery Stopped
id: a1000005-0021-4000-8000-000000000021
description: Detects when cloud log delivery or export destinations are modified or deleted, stopping centralized log collection.
references:
    - https://attack.mitre.org/techniques/T1562/008/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.008
logsource:
    service: cloudtrail
    product: aws
detection:
    selection:
        eventName:
            - 'PutBucketLogging'
            - 'DeleteBucketPolicy'
            - 'PutDeliveryChannel'
            - 'StopConfigurationRecorder'
    condition: selection
falsepositives:
    - Authorized log infrastructure changes by cloud administrators
level: high
