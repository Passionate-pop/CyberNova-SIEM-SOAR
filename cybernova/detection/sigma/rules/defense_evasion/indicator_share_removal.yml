title: Network Share Connection Removed
id: a1000005-0039-4000-8000-000000000039
description: Detects when network share connections are removed, potentially covering up lateral movement artifacts.
references:
    - https://attack.mitre.org/techniques/T1070/005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1070
    - attack.t1070.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_net:
        Image|endswith: '\net.exe'
        CommandLine|contains|all:
            - 'use'
            - '/delete'
    selection_remove_psdrive:
        Image|endswith: '\powershell.exe'
        CommandLine|contains: 'Remove-PSDrive'
    condition: selection_net or selection_remove_psdrive
falsepositives:
    - Authorized disconnection of unused network shares
level: low
