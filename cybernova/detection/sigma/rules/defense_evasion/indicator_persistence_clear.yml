title: Registry Run Key Removed to Clear Persistence
id: a1000005-0044-4000-8000-000000000044
description: Detects when registry Run keys are deleted, potentially removing evidence of persistence mechanisms.
references:
    - https://attack.mitre.org/techniques/T1070/009/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1070
    - attack.t1070.009
logsource:
    category: registry_delete
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\Software\Microsoft\Windows\CurrentVersion\Run\'
            - '\Software\Microsoft\Windows\CurrentVersion\RunOnce\'
            - '\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Run\'
    condition: selection
falsepositives:
    - Authorized removal of legitimate startup entries
level: medium
