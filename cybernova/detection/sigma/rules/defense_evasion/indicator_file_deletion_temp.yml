title: Suspicious Deletion from Temp Directories
id: a1000005-0038-4000-8000-000000000038
description: Detects suspicious file deletion from temporary directories, often used to remove dropped payloads and artifacts.
references:
    - https://attack.mitre.org/techniques/T1070/004/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1070
    - attack.t1070.004
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|contains:
            - '\Temp\'
            - '\TMP\'
            - '\AppData\Local\Temp\'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\cscript.exe'
    condition: selection
falsepositives:
    - Legitimate application cleanup routines
level: medium
