title: Cloud Security Group Set to 0.0.0.0/0
id: a1000005-0019-4000-8000-000000000019
description: Detects when a cloud security group rule is modified to allow traffic from 0.0.0.0/0, exposing resources to the internet.
references:
    - https://attack.mitre.org/techniques/T1562/007/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.007
logsource:
    service: cloudtrail
    product: aws
detection:
    selection:
        eventName:
            - 'AuthorizeSecurityGroupIngress'
            - 'AuthorizeSecurityGroupEgress'
    selection_cidr:
        requestParameters|contains: '0.0.0.0/0'
    condition: selection and selection_cidr
falsepositives:
    - Authorized exposure for public-facing applications
level: high
