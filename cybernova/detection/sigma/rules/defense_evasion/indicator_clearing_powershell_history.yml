title: PowerShell History Cleared
id: a1000005-0035-4000-8000-000000000035
description: Detects when PowerShell command history is cleared via Clear-History or history file deletion.
references:
    - https://attack.mitre.org/techniques/T1070/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1070
    - attack.t1070.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_clear:
        Image|endswith: '\powershell.exe'
        CommandLine|contains: 'Clear-History'
    selection_delete:
        Image|endswith: '\powershell.exe'
        CommandLine|contains:
            - 'Remove-Item'
            - '$env:APPDATA\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt'
    condition: selection_clear or selection_delete
falsepositives:
    - Authorized history clearing for privacy or security
level: medium
