title: Windows Firewall Disabled
id: a1000005-0004-4000-8000-000000000004
description: Detects when Windows Defender Firewall is disabled via netsh or registry modification.
references:
    - https://attack.mitre.org/techniques/T1562/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\netsh.exe'
        CommandLine|contains|all:
            - 'advfirewall'
            - 'off'
    condition: selection
falsepositives:
    - Administrative scripts temporarily disabling firewall during network troubleshooting
level: medium
