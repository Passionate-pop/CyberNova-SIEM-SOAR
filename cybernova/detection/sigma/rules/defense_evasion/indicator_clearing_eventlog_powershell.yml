title: Event Log Cleared via PowerShell Clear-EventLog
id: a1000005-0029-4000-8000-000000000029
description: Detects when Windows event logs are cleared using the PowerShell Clear-EventLog cmdlet.
references:
    - https://attack.mitre.org/techniques/T1070/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1070
    - attack.t1070.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains: 'Clear-EventLog'
    condition: selection
falsepositives:
    - Authorized log maintenance scripts
level: high
