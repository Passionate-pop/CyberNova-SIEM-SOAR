title: Disable Windows Defender via Registry
id: a1000005-0048-4000-8000-000000000048
description: Detects registry modifications that disable Windows Defender antivirus functionality.
references:
    - https://attack.mitre.org/techniques/T1112/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1112
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\Windows Defender\DisableAntiSpyware'
            - '\Windows Defender\Real-Time Protection\DisableRealtimeMonitoring'
            - '\Windows Defender\SpyNet\DisableBlockAtFirstSeen'
        Details: '1'
    condition: selection
falsepositives:
    - Authorized disabling during managed endpoint deployment
level: high
