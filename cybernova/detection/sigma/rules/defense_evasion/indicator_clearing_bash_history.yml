title: Bash History Cleared or Truncated
id: a1000005-0034-4000-8000-000000000034
description: Detects when the .bash_history file is cleared or truncated to remove command history evidence.
references:
    - https://attack.mitre.org/techniques/T1070/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1070
    - attack.t1070.003
logsource:
    category: process_creation
    product: linux
detection:
    selection_rm:
        Image|endswith: '/rm'
        CommandLine|contains: '.bash_history'
    selection_truncate:
        Image|endswith: '/truncate'
        CommandLine|contains: '.bash_history'
    selection_redirect:
        CommandLine|contains:
            - '> .bash_history'
            - 'history -c'
    condition: selection_rm or selection_truncate or selection_redirect
falsepositives:
    - User legitimately clearing their shell history
level: medium
