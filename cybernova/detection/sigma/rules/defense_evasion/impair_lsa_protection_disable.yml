title: LSA Protection Disabled
id: a1000005-0028-4000-8000-000000000028
description: Detects when LSA protection (RunAsPPL) is disabled, allowing untrusted processes to access LSASS memory.
references:
    - https://attack.mitre.org/techniques/T1562/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.001
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\CurrentControlSet\Control\Lsa\RunAsPPL'
        Details: '0'
    condition: selection
falsepositives:
    - Legitimate disabling for driver compatibility issues
level: high
