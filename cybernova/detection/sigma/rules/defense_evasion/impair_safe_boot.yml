title: System Booted into Safe Mode for Defense Evasion
id: a1000005-0023-4000-8000-000000000023
description: Detects when a system is booted into Safe Mode, which disables security software and drivers, enabling defense evasion.
references:
    - https://attack.mitre.org/techniques/T1562/009/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.009
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains: '\CurrentControlSet\Control\SafeBoot'
        EventType: SetValue
    condition: selection
falsepositives:
    - System booted into Safe Mode for legitimate troubleshooting
level: medium
