title: Network Connection History Cleared
id: a1000005-0042-4000-8000-000000000042
description: Detects when network connection history is cleared, including arp cache, dns cache, and netstat history.
references:
    - https://attack.mitre.org/techniques/T1070/007/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1070
    - attack.t1070.007
logsource:
    category: process_creation
    product: windows
detection:
    selection_arp:
        Image|endswith: '\arp.exe'
        CommandLine|contains: '-d'
    selection_dns:
        Image|endswith: '\ipconfig.exe'
        CommandLine|contains: '/flushdns'
    selection_nbtstat:
        Image|endswith: '\nbtstat.exe'
        CommandLine|contains: '-R'
    condition: selection_arp or selection_dns or selection_nbtstat
falsepositives:
    - Authorized network cache clearing for troubleshooting
level: low
