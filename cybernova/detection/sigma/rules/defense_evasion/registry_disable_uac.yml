title: Disable UAC via Registry Modification
id: a1000005-0050-4000-8000-000000000050
description: Detects when User Account Control is disabled via registry, allowing elevated access without prompting.
references:
    - https://attack.mitre.org/techniques/T1112/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1112
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith:
            - '\Software\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA'
            - '\Software\Microsoft\Windows\CurrentVersion\Policies\System\ConsentPromptBehaviorAdmin'
        Details: '0'
    condition: selection
falsepositives:
    - Authorized UAC disabling in controlled environments
level: high
