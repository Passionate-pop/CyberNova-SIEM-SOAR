title: PowerShell Downgrade Attack
id: a1000005-0025-4000-8000-000000000025
description: Detects when PowerShell is forced to use version 2, bypassing script block logging and AMSI protections.
references:
    - https://attack.mitre.org/techniques/T1562/010/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.010
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains: '-Version 2'
    condition: selection
falsepositives:
    - Scripts requiring PowerShell 2 compatibility
level: high
