title: Registry Modifications Disabling Security Software
id: a1000005-0047-4000-8000-000000000047
description: Detects registry modifications that disable security software components through common registry keys.
references:
    - https://attack.mitre.org/techniques/T1112/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1112
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\Microsoft\Security Center'
            - '\SOFTWARE\Policies\Microsoft\Windows Defender'
            - '\SOFTWARE\Policies\Microsoft\Microsoft Antimalware'
        EventType: SetValue
    condition: selection
falsepositives:
    - Authorized configuration changes by security administrators
level: high
