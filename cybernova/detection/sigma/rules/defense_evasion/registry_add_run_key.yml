title: New Value Added to Run or RunOnce Keys
id: a1000005-0051-4000-8000-000000000051
description: Detects when new values are added to registry Run or RunOnce keys for persistence.
references:
    - https://attack.mitre.org/techniques/T1112/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1112
logsource:
    category: registry_add
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\Software\Microsoft\Windows\CurrentVersion\Run\'
            - '\Software\Microsoft\Windows\CurrentVersion\RunOnce\'
            - '\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Run\'
            - '\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\RunOnce\'
    condition: selection
falsepositives:
    - Legitimate application installation adding startup entries
level: medium
