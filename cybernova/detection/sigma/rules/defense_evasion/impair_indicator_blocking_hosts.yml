title: Hosts File Modified to Block Security URLs
id: a1000005-0016-4000-8000-000000000016
description: Detects modifications to the hosts file that redirect security vendor domains, preventing telemetry and updates.
references:
    - https://attack.mitre.org/techniques/T1562/006/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.006
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|endswith: '\drivers\etc\hosts'
        Image|endswith:
            - '\powershell.exe'
            - '\cmd.exe'
            - '\cscript.exe'
            - '\wscript.exe'
            - '\notepad.exe'
    condition: selection
falsepositives:
    - Authorized hosts file modification for web filtering or testing
level: high
