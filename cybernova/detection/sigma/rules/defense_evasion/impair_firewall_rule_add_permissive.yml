title: Permissive Firewall Rule Added
id: a1000005-0014-4000-8000-000000000014
description: Detects when a permissive firewall rule allowing all inbound or outbound traffic is added, bypassing network restrictions.
references:
    - https://attack.mitre.org/techniques/T1562/004/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.004
logsource:
    category: process_creation
    product: windows
detection:
    selection_netsh:
        Image|endswith: '\netsh.exe'
        CommandLine|contains|all:
            - 'advfirewall'
            - 'add'
            - 'rule'
            - 'any'
    selection_powershell:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'New-NetFirewallRule'
            - '-Direction'
            - '-Action'
            - 'Allow'
            - '-RemoteAddress'
            - 'Any'
    condition: selection_netsh or selection_powershell
falsepositives:
    - Authorized rule creation for legitimate application compatibility
level: high
