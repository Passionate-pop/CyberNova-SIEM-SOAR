title: DNS Filtering or Sinkhole Bypass Attempt
id: a1000005-0017-4000-8000-000000000017
description: Detects attempts to bypass DNS filtering or sinkholes by modifying DNS server configuration or using direct IP resolution.
references:
    - https://attack.mitre.org/techniques/T1562/006/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.006
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\Interfaces\'
            - '\Tcpip\Parameters'
        TargetObject|endswith:
            - '\NameServer'
            - '\DhcpNameServer'
        EventType: SetValue
    condition: selection
falsepositives:
    - Legitimate DNS configuration change by network administrators
level: medium
