title: Firewall Rule Deleted
id: a1000005-0013-4000-8000-000000000013
description: Detects when firewall rules are deleted via netsh or PowerShell, potentially bypassing network restrictions.
references:
    - https://attack.mitre.org/techniques/T1562/004/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.004
logsource:
    category: process_creation
    product: windows
detection:
    selection_netsh:
        Image|endswith: '\netsh.exe'
        CommandLine|contains|all:
            - 'advfirewall'
            - 'delete'
            - 'rule'
    selection_powershell:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'Remove-NetFirewallRule'
            - '-Name'
    condition: selection_netsh or selection_powershell
falsepositives:
    - Authorized firewall rule cleanup during network reconfiguration
level: medium
