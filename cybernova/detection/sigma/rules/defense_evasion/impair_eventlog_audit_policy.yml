title: Audit Policy Disabled via Auditpol
id: a1000005-0011-4000-8000-000000000011
description: Detects when audit policies are disabled using auditpol.exe, suppressing security event generation.
references:
    - https://attack.mitre.org/techniques/T1562/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\auditpol.exe'
        CommandLine|contains|all:
            - '/remove'
            - '/category'
    condition: selection
falsepositives:
    - Authorized audit policy reconfiguration by security teams
level: high
