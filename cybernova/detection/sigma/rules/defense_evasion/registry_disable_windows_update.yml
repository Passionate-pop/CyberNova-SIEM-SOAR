title: Windows Update Disabled via Registry
id: a1000005-0055-4000-8000-000000000055
description: Detects when Windows Update is disabled or set to notify-only via registry, preventing automatic patching.
references:
    - https://attack.mitre.org/techniques/T1112/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1112
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\Microsoft\Windows\CurrentVersion\WindowsUpdate'
            - '\Policies\Microsoft\Windows\WindowsUpdate'
        EventType: SetValue
    condition: selection
falsepositives:
    - Authorized configuration for systems with controlled patch deployment
level: medium
