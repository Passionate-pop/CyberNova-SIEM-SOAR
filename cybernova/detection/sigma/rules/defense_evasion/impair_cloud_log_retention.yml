title: Cloud Log Retention Period Reduced or Deleted
id: a1000005-0022-4000-8000-000000000022
description: Detects when cloud log retention policies are shortened or deleted, causing automatic log deletion and reduced forensic visibility.
references:
    - https://attack.mitre.org/techniques/T1562/008/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.008
logsource:
    service: cloudtrail
    product: aws
detection:
    selection:
        eventName:
            - 'PutBucketLifecycleConfiguration'
            - 'DeleteBucketLifecycle'
            - 'ModifyLogRetentionDuration'
    condition: selection
falsepositives:
    - Authorized retention policy changes for cost optimization
level: medium
