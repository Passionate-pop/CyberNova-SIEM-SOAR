title: Individual Event Log Disabled via Registry
id: a1000005-0012-4000-8000-000000000012
description: Detects when individual event logs are disabled through registry manipulation, suppressing specific log sources.
references:
    - https://attack.mitre.org/techniques/T1562/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.002
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        EventType: SetValue
        TargetObject|contains: '\SYSTEM\CurrentControlSet\Services\EventLog\'
        TargetObject|endswith: '\Disabled'
        Details: '1'
    condition: selection
falsepositives:
    - Security hardening scripts disabling unused logs
level: medium
