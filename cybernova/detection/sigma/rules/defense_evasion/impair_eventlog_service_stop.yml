title: EventLog Service Stopped or Disabled
id: a1000005-0010-4000-8000-000000000010
description: Detects when the Windows EventLog service is stopped or disabled, preventing event logging of malicious activity.
references:
    - https://attack.mitre.org/techniques/T1562/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_sc:
        Image|endswith: '\sc.exe'
        CommandLine|contains|all:
            - 'EventLog'
            - 'stop'
    selection_net:
        Image|endswith: '\net.exe'
        CommandLine|contains|all:
            - 'stop'
            - 'EventLog'
    selection_reg:
        TargetObject|contains: '\Services\EventLog\Start'
        Details: '4'
    condition: selection_sc or selection_net or selection_reg
falsepositives:
    - Service disabled by security software during forensic imaging
level: high
