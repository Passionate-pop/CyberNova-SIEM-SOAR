title: Remote Log Forwarding Disabled
id: a1000005-0026-4000-8000-000000000026
description: Detects when remote log forwarding or centralized logging is disabled, preventing off-host log collection.
references:
    - https://attack.mitre.org/techniques/T1562/011/
author: CyberNova
date: 2025-01-01
tags:
    - attack.defense_evasion
    - attack.t1562
    - attack.t1562.011
logsource:
    category: process_creation
    product: windows
detection:
    selection_wec:
        Image|endswith: '\wecutil.exe'
        CommandLine|contains: 'stop'
    selection_winrm:
        Image|endswith: '\winrm.cmd'
        CommandLine|contains: 'delete'
    selection_reg:
        TargetObject|contains:
            - '\Services\EventForwarder\'
            - '\Windows Remote Management'
        Details|contains: '4'
    condition: selection_wec or selection_winrm or selection_reg
falsepositives:
    - Authorized log forwarding service maintenance
level: medium
