title: Token Impersonation (SeImpersonate, SeAssignPrimaryToken)
id: a1000004-0028-4000-8000-000000000028
description: Detects privilege escalation attempts leveraging SeImpersonate or SeAssignPrimaryToken privileges to impersonate access tokens
references:
    - https://attack.mitre.org/techniques/T1134/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1134.001
logsource:
    category: process_access
    product: windows
detection:
    selection:
        GrantedAccess|contains:
            - 'TOKEN_IMPERSONATE'
            - 'TOKEN_DUPLICATE'
            - 'TOKEN_ASSIGN_PRIMARY'
        SourceImage|endswith:
            - '\powershell.exe'
            - '\cmd.exe'
    condition: selection
falsepositives:
    - Legitimate token management by system tools
level: high
