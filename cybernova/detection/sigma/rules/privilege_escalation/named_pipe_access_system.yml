title: SYSTEM Account Named Pipe Access from Low-Integrity Process
id: a1000004-0026-4000-8000-000000000026
description: Detects low-integrity processes accessing named pipes typically owned by SYSTEM account which may indicate privilege escalation
references:
    - https://attack.mitre.org/techniques/T1068/
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1068
logsource:
    category: pipe_connected
    product: windows
detection:
    selection:
        PipeName|contains:
            - '\pipe\lsarpc'
            - '\pipe\ntsvcs'
            - '\pipe\epmapper'
        IntegrityLevel: 'Low'
    condition: selection
falsepositives:
    - Legitimate low-integrity system monitoring tools
level: high
