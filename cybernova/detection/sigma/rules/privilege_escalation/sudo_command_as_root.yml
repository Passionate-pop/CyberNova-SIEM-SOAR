title: Suspicious Command Run via Sudo as Root
id: a1000004-0011-4000-8000-000000000011
description: Detects execution of suspicious commands via sudo as root user which may indicate privilege escalation
references:
    - https://attack.mitre.org/techniques/T1548/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1548.003
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith: '/sudo'
        CommandLine|contains:
            - 'su -'
            - '/bin/bash'
            - '/bin/sh'
            - '/bin/zsh'
            - 'passwd'
    condition: selection
falsepositives:
    - Legitimate system administration commands
level: low
