title: Outdated Vulnerable Service Detected
id: a1000004-0022-4000-8000-000000000022
description: Detects execution or registration of known outdated service versions with published privilege escalation vulnerabilities
references:
    - https://attack.mitre.org/techniques/T1068/
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1068
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - '--version'
            - '-version'
            - '1.0.'
            - '0.1.'
            - '2008'
            - '2012'
    condition: selection
falsepositives:
    - Legacy software still in use
    - Internal tools with old version strings
level: low
