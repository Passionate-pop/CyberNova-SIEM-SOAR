title: Suspicious Setuid/Setgid Binary Creation
id: a1000004-0001-4000-8000-000000000001
description: Detects creation of setuid or setgid binaries which can be leveraged for privilege escalation
references:
    - https://attack.mitre.org/techniques/T1548/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1548.001
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith:
            - '/chmod'
            - '/chown'
        CommandLine|contains:
            - 'u+s'
            - 'g+s'
            - 'ug+s'
    condition: selection
falsepositives:
    - Legitimate system administration activities
    - Software installation processes
level: medium
