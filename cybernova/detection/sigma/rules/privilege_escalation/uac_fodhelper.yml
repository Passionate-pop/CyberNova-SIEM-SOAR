title: Fodhelper.exe UAC Bypass Technique
id: a1000004-0006-4000-8000-000000000006
description: Detects the Fodhelper.exe UAC bypass technique where registry keys are modified to execute commands without elevation prompt
references:
    - https://attack.mitre.org/techniques/T1548/002/
    - https://uacmeltdown.blogspot.com/
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1548.002
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\Classes\ms-settings\shell\open\command'
            - '\CurrentVersion\App Paths\fodhelper.exe'
        Image|endswith: '\fodhelper.exe'
    condition: selection
falsepositives:
    - Rare legitimate software installations
level: high
