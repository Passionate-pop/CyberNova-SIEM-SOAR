title: sdclt.exe UAC Bypass
id: a1000004-0008-4000-8000-000000000008
description: Detects abuse of sdclt.exe to bypass UAC by modifying registry keys leading to elevated command execution
references:
    - https://attack.mitre.org/techniques/T1548/002/
    - https://posts.specterops.io/uac-bypass-sdclt-9ca756c8b3c3
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1548.002
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        TargetObject|contains: '\exefile\shell\runas\command'
        Image|endswith: '\sdclt.exe'
    condition: selection
falsepositives:
    - Legitimate use of sdclt with troubleshooting
level: medium
