title: Sudo Cache Timeout Modification
id: a1000004-0010-4000-8000-000000000010
description: Detects modification of sudo timestamp_timeout to extend sudo credential caching window
references:
    - https://attack.mitre.org/techniques/T1548/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1548.003
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith: '/sudo'
        CommandLine|contains: 'timestamp_timeout'
    condition: selection
falsepositives:
    - Authorized system hardening configurations
level: low
