title: DLL Side-Loading UAC Bypass
id: a1000004-0009-4000-8000-000000000009
description: Detects DLL side-loading abuse used to bypass User Account Control by placing malicious DLL in trusted binary search path
references:
    - https://attack.mitre.org/techniques/T1548/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1548.002
logsource:
    category: image_load
    product: windows
detection:
    selection:
        Image|startswith:
            - 'C:\Program Files\'
            - 'C:\Program Files (x86)\'
            - 'C:\Windows\System32\'
        ImageLoaded|endswith: '.dll'
        ImageLoaded|contains:
            - '\AppData\Local\'
            - '\AppData\Roaming\'
            - '\Temp\'
    condition: selection
falsepositives:
    - Legitimate DLL side-loading from trusted applications
level: medium
