title: Application Sandbox Escape Attempt
id: a1000004-0024-4000-8000-000000000024
description: Detects attempts to escape application sandboxes using known break-out techniques for privilege escalation
references:
    - https://attack.mitre.org/techniques/T1068/
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1068
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|contains:
            - '\AppContainer\'
            - 'sandbox'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\wscript.exe'
    condition: selection
falsepositives:
    - Legitimate broker processes
level: high
