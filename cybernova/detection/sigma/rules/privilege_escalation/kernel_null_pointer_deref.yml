title: NULL Pointer Dereference Pattern
id: a1000004-0017-4000-8000-000000000017
description: Detects attempts to trigger null pointer dereference conditions in kernel space as a privilege escalation method
references:
    - https://attack.mitre.org/techniques/T1068/
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1068
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'mmap(0,'
            - 'MAP_FIXED'
            - 'mmap_min_addr'
    condition: selection
falsepositives:
    - Low-level memory management tools
    - Kernel module development
level: high
