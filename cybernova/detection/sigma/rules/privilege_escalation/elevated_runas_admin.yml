title: Run as Administrator from Non-Elevated Process
id: a1000004-0013-4000-8000-000000000013
description: Detects when a non-elevated process attempts to run a binary as administrator using runas or shell runas verb
references:
    - https://attack.mitre.org/techniques/T1548/004/
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1548.004
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\runas.exe'
            - '\rundll32.exe'
        CommandLine|contains:
            - 'runas'
            - 'runasuser'
    condition: selection
falsepositives:
    - Legitimate administrative tasks
    - Software installers requesting elevation
level: medium
