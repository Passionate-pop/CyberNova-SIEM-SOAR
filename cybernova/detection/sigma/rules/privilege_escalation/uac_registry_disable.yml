title: Registry Disabling UAC
id: a1000004-0004-4000-8000-000000000004
description: Detects modification of the registry key that disables User Account Control (EnableLUA set to 0)
references:
    - https://attack.mitre.org/techniques/T1548/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1548.002
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        TargetObject|endswith: '\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA'
        Details: '0'
    condition: selection
falsepositives:
    - Authorized system hardening scripts
    - IT administrative tools
level: high
