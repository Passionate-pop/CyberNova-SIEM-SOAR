title: Vulnerable Driver Load (Ring0)
id: a1000004-0016-4000-8000-000000000016
description: Detects loading of known vulnerable kernel drivers that can be exploited for ring0 privilege escalation
references:
    - https://attack.mitre.org/techniques/T1068/
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1068
logsource:
    category: driver_load
    product: windows
detection:
    selection:
        ImageLoaded|contains:
            - 'capcom.sys'
            - 'gdrv.sys'
            - 'virtualinput.sys'
            - 'iqvw64.sys'
            - 'rtcore64.sys'
    condition: selection
falsepositives:
    - Legitimate use of vulnerable drivers in development environments
level: critical
