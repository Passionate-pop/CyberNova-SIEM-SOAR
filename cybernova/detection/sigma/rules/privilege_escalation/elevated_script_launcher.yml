title: Script Launcher Requesting Elevation
id: a1000004-0014-4000-8000-000000000014
description: Detects script interpreters (PowerShell, cmd, WScript) launched with request for elevation via ShellExecute runas verb
references:
    - https://attack.mitre.org/techniques/T1548/004/
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1548.004
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
        CommandLine|contains:
            - 'verb runas'
            - 'runas'
    condition: selection
falsepositives:
    - Legitimate scripts requiring administrative privileges
level: medium
