title: Known DLL Hijacking Vulnerability Exploited
id: a1000004-0023-4000-8000-000000000023
description: Detects attempts to exploit known DLL hijacking vulnerabilities in common Windows applications for privilege escalation
references:
    - https://attack.mitre.org/techniques/T1068/
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1068
logsource:
    category: image_load
    product: windows
detection:
    selection:
        Image|endswith:
            - '\chrome.exe'
            - '\firefox.exe'
            - '\Teams.exe'
            - '\OfficeClickToRun.exe'
        ImageLoaded|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
    condition: selection
falsepositives:
    - Unusual but legitimate application behavior
level: medium
