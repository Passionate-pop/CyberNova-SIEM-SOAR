title: Service with Weak Permissions Modification
id: a1000004-0020-4000-8000-000000000020
description: Detects modification of Windows service configurations that may indicate exploitation of weak service permissions
references:
    - https://attack.mitre.org/techniques/T1068/
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1068
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\sc.exe'
            - '\powershell.exe'
        CommandLine|contains|all:
            - 'config'
            - 'binPath'
    condition: selection
falsepositives:
    - Authorized service configuration changes by administrators
level: high
