title: CreateProcessWithToken(Logon) Call
id: a1000004-0030-4000-8000-000000000030
description: Detects use of CreateProcessWithTokenW API calls to create a process with an elevated token
references:
    - https://attack.mitre.org/techniques/T1134/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.privilege_escalation
    - attack.t1134.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\cmd.exe'
        CommandLine|contains:
            - 'CreateProcessWithToken'
            - 'LOGON_WITH_PROFILE'
    condition: selection
falsepositives:
    - Legitimate software using explicit logon sessions
level: medium
