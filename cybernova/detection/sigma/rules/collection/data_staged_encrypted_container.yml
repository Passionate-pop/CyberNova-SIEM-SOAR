title: Encrypted Container Creation for Data Staging
id: a1000009-0020-4000-8000-000000000020
description: Detects creation of VeraCrypt, BitLocker, or other encrypted containers which may be used for staging collected data
references:
    - https://attack.mitre.org/techniques/T1074/
author: CyberNova
date: 2025-01-01
tags:
    - attack.collection
    - attack.t1074
logsource:
    category: process_creation
    product: windows
detection:
    selection_veracrypt:
        Image|endswith: '\VeraCrypt.exe'
        CommandLine|contains:
            - '/create'
            - '-c'
            - '--create'
    selection_bitlocker:
        Image|endswith: '\manage-bde.exe'
        CommandLine|contains:
            - '-on'
            - '-protectors'
            - '-enable'
    selection_diskpart:
        Image|endswith: '\diskpart.exe'
    selection_vhd_mount:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'Mount-VHD'
            - '-Path'
    condition: 1 of selection_*
falsepositives:
    - IT administration deploying encrypted volumes
    - Users encrypting personal external drives
level: medium
