title: Encrypted Archive Creation for Data Exfiltration
id: a1000009-0004-4000-8000-000000000004
description: Detects creation of password-protected or encrypted archives using zip, 7z, rar with encryption flags
references:
    - https://attack.mitre.org/techniques/T1560/
author: CyberNova
date: 2025-01-01
tags:
    - attack.collection
    - attack.t1560
logsource:
    category: process_creation
    product: windows
detection:
    selection_7z:
        Image|endswith: '\7z.exe'
        CommandLine|contains:
            - '-p'
            - '-mhe=on'
    selection_winrar:
        Image|endswith: '\rar.exe'
        CommandLine|contains:
            - '-p'
            - '-hp'
    selection_zip:
        Image|endswith: '\zip.exe'
        CommandLine|contains:
            - '-e'
            - '-P'
            - '--encrypt'
    condition: 1 of selection_*
falsepositives:
    - Users encrypting sensitive personal archives
    - Legitimate backup solutions using encryption
level: high
