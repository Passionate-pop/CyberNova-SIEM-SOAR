title: Mass Document Collection of Office Files
id: a1000009-0014-4000-8000-000000000014
description: Detects bulk copy or enumeration of Microsoft Office documents (docx, xlsx, pptx) and PDFs from user directories
references:
    - https://attack.mitre.org/techniques/T1005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.collection
    - attack.t1005
logsource:
    category: process_creation
    product: windows
detection:
    selection_copy:
        Image|endswith:
            - '\cmd.exe'
            - '\xcopy.exe'
            - '\robocopy.exe'
            - '\powershell.exe'
        CommandLine|contains:
            - '.doc'
            - '.xls'
            - '.ppt'
            - '.pdf'
    selection_bulk:
        CommandLine|contains|all:
            - 'copy'
            - '*.doc'
            - '*.pdf'
            - '/s'
    selection_powershell_bulk:
        CommandLine|contains|all:
            - 'Copy-Item'
            - '*.doc'
            - '*.pdf'
            - '-Recurse'
    condition: selection_copy and (selection_bulk or selection_powershell_bulk)
falsepositives:
    - Legal discovery or document review processes
    - Document management system ingestion
level: medium
