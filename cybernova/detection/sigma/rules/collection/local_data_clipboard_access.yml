title: Clipboard Data Access Detected
id: a1000009-0009-4000-8000-000000000009
description: Detects attempts to access clipboard data via PowerShell or other tools, potential data collection
references:
    - https://attack.mitre.org/techniques/T1005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.collection
    - attack.t1005
logsource:
    category: process_creation
    product: windows
detection:
    selection_powershell:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains|all:
            - 'Get-Clipboard'
            - 'Add-Type'
            - '-AssemblyName'
            - 'System.Windows.Forms'
    selection_cmd:
        Image|endswith: '\cmd.exe'
        CommandLine|contains:
            - 'clip'
            - 'powershell'
    selection_direct_api:
        CommandLine|contains:
            - 'GetClipboardData'
            - 'OpenClipboard'
            - 'CF_TEXT'
    condition: 1 of selection_*
falsepositives:
    - Password manager clipboard operations
    - Legitimate clipboard utility software
level: medium
