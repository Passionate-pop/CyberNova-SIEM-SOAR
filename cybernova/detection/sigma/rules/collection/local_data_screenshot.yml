title: Screen Capture Tool Execution
id: a1000009-0008-4000-8000-000000000008
description: Detects execution of screen capture utilities used to collect sensitive visual data from the desktop
references:
    - https://attack.mitre.org/techniques/T1005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.collection
    - attack.t1005
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        Image|endswith:
            - '\SnippingTool.exe'
            - '\SnippingTool.exe'
            - '\ScreenRecorder.exe'
            - '\OBS64.exe'
            - '\obs64.exe'
            - '\Greenshot.exe'
            - '\Snipaste.exe'
            - '\ShareX.exe'
    selection_flags:
        CommandLine|contains:
            - '-snip'
            - '-clipboard'
            - '/capture'
            - '/screen'
            - '--region'
    condition: selection_tools or selection_flags
falsepositives:
    - Help desk or documentation screenshot creation
    - Legitimate use of screencap tools for presentations
level: low
