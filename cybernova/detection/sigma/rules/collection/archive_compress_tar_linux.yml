title: Archive Collection via Linux Archiving Tools
id: a1000009-0003-4000-8000-000000000003
description: Detects use of tar, cpio, gzip, bzip2, or xz for creating archives on Linux systems
references:
    - https://attack.mitre.org/techniques/T1560/
author: CyberNova
date: 2025-01-01
tags:
    - attack.collection
    - attack.t1560
logsource:
    category: process_creation
    product: linux
detection:
    selection_tar:
        Image|endswith: '/tar'
        CommandLine|contains: '-cf'
    selection_gzip:
        Image|endswith:
            - '/gzip'
            - '/bzip2'
            - '/xz'
            - '/cpio'
    selection_output:
        CommandLine|contains|all:
            - '.tar'
            - '.gz'
            - '.bz2'
            - '.xz'
    condition: selection_tar or (selection_gzip and selection_output)
falsepositives:
    - Software package builds
    - System backup cron jobs
    - Legitimate DevOps deployment pipelines
level: low
