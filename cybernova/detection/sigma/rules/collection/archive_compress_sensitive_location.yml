title: Archive Creation from Sensitive User Directories
id: a1000009-0006-4000-8000-000000000006
description: Detects archiving operations targeting sensitive user directories such as Documents, Desktop, or Pictures
references:
    - https://attack.mitre.org/techniques/T1560/
author: CyberNova
date: 2025-01-01
tags:
    - attack.collection
    - attack.t1560
logsource:
    category: process_creation
    product: windows
detection:
    selection_archive:
        Image|endswith:
            - '\7z.exe'
            - '\rar.exe'
            - '\zip.exe'
            - '\winrar.exe'
    selection_path:
        CommandLine|contains:
            - '\Documents\'
            - '\Desktop\'
            - '\Pictures\'
            - '\Downloads\'
    condition: selection_archive and selection_path
falsepositives:
    - Backup software archiving user profile data
    - File migration or transfer activities
level: high
