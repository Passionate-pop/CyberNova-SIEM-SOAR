title: Archive File Written to Cloud Storage Sync Folder
id: a1000009-0007-4000-8000-000000000007
description: Detects archive files created within cloud storage sync directories, indicating staged data ready for exfiltration via cloud
references:
    - https://attack.mitre.org/techniques/T1560/
author: CyberNova
date: 2025-01-01
tags:
    - attack.collection
    - attack.t1560
logsource:
    category: file_event
    product: windows
detection:
    selection_cloud_paths:
        TargetFilename|contains:
            - '\Dropbox\'
            - '\Google Drive\'
            - '\OneDrive\'
            - '\iCloud\'
            - '\Box\'
    selection_archive_ext:
        TargetFilename|endswith:
            - '.zip'
            - '.rar'
            - '.7z'
            - '.tar'
            - '.tar.gz'
    condition: selection_cloud_paths and selection_archive_ext
falsepositives:
    - Legitimate cloud backup of archives
    - User archiving personal files within cloud sync folder
level: high
