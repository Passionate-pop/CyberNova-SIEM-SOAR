title: Bulk File Discovery in Sensitive Directories
id: a1000009-0010-4000-8000-000000000010
description: Detects mass enumeration of files in sensitive directories using command-line tools, indicative of data collection reconnaissance
references:
    - https://attack.mitre.org/techniques/T1005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.collection
    - attack.t1005
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\es.exe'
            - '\findstr.exe'
        CommandLine|contains:
            - '\Documents'
            - '\Desktop'
            - '\AppData'
    selection_flags:
        CommandLine|contains|all:
            - '/s'
            - '.doc'
            - '.xls'
            - '.pdf'
    selection_recursive:
        CommandLine|contains:
            - '/r'
            - '-Recurse'
            - 'Get-ChildItem'
    condition: selection_tools and (selection_flags or selection_recursive)
falsepositives:
    - Antivirus or backup scanning operations
    - System administration inventory scripts
level: medium
