title: Archive via Built-in Compression Tool (rar/zip/7z)
id: a1000009-0001-4000-8000-000000000001
description: Detects use of archiving utilities for potential data staging
references:
    - https://attack.mitre.org/techniques/T1560/
author: CyberNova
date: 2025-01-01
tags:
    - attack.collection
    - attack.t1560
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\winrar.exe'
            - '\7z.exe'
            - '\7zG.exe'
            - '\rar.exe'
            - '\zip.exe'
            - '\unzip.exe'
    condition: selection
falsepositives:
    - Legitimate backup/archiving activity
level: low