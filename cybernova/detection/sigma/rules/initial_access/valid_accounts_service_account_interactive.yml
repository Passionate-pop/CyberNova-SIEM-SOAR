title: Service Account Interactive Login
id: a1000001-0016-4000-8000-000000000016
description: Detects interactive logins performed by service accounts
references:
    - https://attack.mitre.org/techniques/T1078/
author: CyberNova
date: 2025-01-01
tags:
    - attack.initial_access
    - attack.t1078
logsource:
    category: authentication
    product: windows
detection:
    selection:
        EventID: 4624
        LogonType:
            - 2
            - 10
            - 11
        TargetUserName|endswith:
            - $
        TargetUserName|startswith:
            - SRV_
            - SVC_
            - svc_
            - service
    condition: selection
falsepositives:
    - Administrator performing service account testing
    - Legitimate service account configuration
level: high
