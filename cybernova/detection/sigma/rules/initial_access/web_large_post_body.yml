title: Suspiciously Large POST Request Body
id: a1000001-0008-4000-8000-000000000008
description: Detects abnormally large HTTP request bodies that may indicate exploitation attempts
references:
    - https://attack.mitre.org/techniques/T1190/
author: CyberNova
date: 2025-01-01
tags:
    - attack.initial_access
    - attack.t1190
logsource:
    category: webserver
    product: web
detection:
    selection:
        cs-method:
            - POST
            - PUT
            - PATCH
        sc-bytes|gt: 50000000
    condition: selection
falsepositives:
    - Large file uploads
    - Media content uploads
    - Backup uploads
level: low
