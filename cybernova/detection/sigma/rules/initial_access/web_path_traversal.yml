title: Path Traversal Attempt
id: a1000001-0003-4000-8000-000000000003
description: Detects path traversal patterns in HTTP requests
references:
    - https://attack.mitre.org/techniques/T1190/
author: CyberNova
date: 2025-01-01
tags:
    - attack.initial_access
    - attack.t1190
logsource:
    category: webserver
    product: generic
detection:
    selection:
        request|contains:
            - "../"
            - "..\\"
            - "%2e%2e%2f"
            - "%252e%252e%252f"
            - "..%252f"
            - "..%2f"
            - "..%5c"
            - "/etc/passwd"
            - "/etc/shadow"
            - "boot.ini"
            - "web.config"
    condition: selection
falsepositives:
    - Security scanner traffic
    - Legitimate file serving
level: high