title: Partner VPN Connection from Unexpected IP
id: a1000001-0033-4000-8000-000000000033
description: Detects partner VPN connections originating from IP addresses outside their known ranges
references:
    - https://attack.mitre.org/techniques/T1199/
author: CyberNova
date: 2025-01-01
tags:
    - attack.initial_access
    - attack.t1199
logsource:
    category: firewall
    product: network
detection:
    selection:
        VPNAction: authenticate
        UserType: partner
        SourceIP|notcontains:
            - 203.0.113.
            - 198.51.100.
    condition: selection
falsepositives:
    - Partner network reconfiguration
    - Partner employee traveling
    - Partner merger or acquisition
level: high
