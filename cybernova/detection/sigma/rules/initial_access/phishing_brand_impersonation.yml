title: Brand Impersonation in Email
id: a1000001-0031-4000-8000-000000000031
description: Detects emails attempting to impersonate well-known brands or internal domains
references:
    - https://attack.mitre.org/techniques/T1566/
author: CyberNova
date: 2025-01-01
tags:
    - attack.initial_access
    - attack.t1566
logsource:
    category: email
    product: generic
detection:
    selection:
        SenderDomain|contains:
            - microsoft-support
            - apple-help
            - google-verify
            - amazon-confirm
            - paypal-secure
            - dropbox-login
            - adobe-verify
        SenderDomain|endswith:
            - .xyz
            - .top
            - .club
            - .online
            - .site
    condition: selection
falsepositives:
    - Legitimate marketing emails from third-party vendors
    - Multi-brand corporate entities
level: high
