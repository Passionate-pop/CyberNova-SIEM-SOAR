title: Web Command Injection Attempt
id: a1000001-0006-4000-8000-000000000006
description: Detects command injection attempts through HTTP parameters
references:
    - https://attack.mitre.org/techniques/T1190/
author: CyberNova
date: 2025-01-01
tags:
    - attack.initial_access
    - attack.t1190
logsource:
    category: webserver
    product: web
detection:
    selection:
        cs-uri-query|contains:
            - ';ls'
            - ';cat'
            - ';whoami'
            - ';id'
            - ';pwd'
            - '|ls'
            - '|cat'
            - '|whoami'
            - '`ls'
            - '`cat'
            - '$(cat'
            - '$(whoami'
            - 'cmd.exe'
            - 'powershell'
    condition: selection
falsepositives:
    - Legitimate use of shell characters in search parameters
    - Security scanning tools
level: high
