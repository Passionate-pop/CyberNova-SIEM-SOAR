title: Credential Harvesting Page Visited
id: a1000001-0029-4000-8000-000000000029
description: Detects access to known credential harvesting or phishing kit URLs
references:
    - https://attack.mitre.org/techniques/T1566/
author: CyberNova
date: 2025-01-01
tags:
    - attack.initial_access
    - attack.t1566
logsource:
    category: proxy
    product: network
detection:
    selection:
        cs-uri-stem|contains:
            - /login/
            - /signin/
            - /auth/
            - /authenticate/
            - /verify/
            - /account/
        cs-referrer|contains:
            - phishing
            - login
            - secure
            - webmail
    condition: selection
falsepositives:
    - Legitimate login page access
    - Security team testing
level: medium
