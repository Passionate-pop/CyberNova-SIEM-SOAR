title: Suspicious JavaScript Downloaded from Web
id: a1000001-0010-4000-8000-000000000010
description: Detects obfuscated or suspicious JavaScript content in HTTP responses
references:
    - https://attack.mitre.org/techniques/T1189/
author: CyberNova
date: 2025-01-01
tags:
    - attack.initial_access
    - attack.t1189
logsource:
    category: proxy
    product: network
detection:
    selection:
        http.content_type|contains:
            - javascript
            - ecmascript
        http.response_body|contains:
            - eval(
            - document.write(
            - fromCharCode
            - unescape(
            - String.fromCharCode
            - atob(
            - escape(
            - \x3c\x73\x63
            - \u0065val
    condition: selection
falsepositives:
    - Legitimate JavaScript minification
    - CDN hosted libraries
level: medium
