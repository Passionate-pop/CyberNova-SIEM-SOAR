title: Web Application Port Scan / Recon
id: a1000001-0001-4000-8000-000000000001
description: Detects multiple connection attempts to different ports on a web server from a single source
references:
    - https://attack.mitre.org/techniques/T1190/
author: CyberNova
date: 2025-01-01
tags:
    - attack.initial_access
    - attack.t1190
logsource:
    category: firewall
    product: web
detection:
    selection:
        src_ip: "*"
        dst_port|contains:
            - 80
            - 443
            - 8080
            - 8443
        action: "block"
    condition: selection
falsepositives:
    - Legitimate scanning tools
    - CDN probes
level: medium