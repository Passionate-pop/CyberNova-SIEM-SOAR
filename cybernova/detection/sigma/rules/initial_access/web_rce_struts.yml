title: Struts RCE Exploitation Attempt
id: a1000001-0004-4000-8000-000000000004
description: Detects Apache Struts remote code execution attempts via OGNL injection
references:
    - https://attack.mitre.org/techniques/T1190/
author: CyberNova
date: 2025-01-01
tags:
    - attack.initial_access
    - attack.t1190
logsource:
    category: webserver
    product: web
detection:
    selection:
        cs-method: 
            - POST
            - GET
        cs-uri-query|contains:
            - OGNL
            - '%24%7B'
            - '${'
            - '#_memberAccess'
            - '@DEFAULT_MEMBER_ACCESS'
            - '#context'
    condition: selection
falsepositives:
    - Legitimate security scanning
    - Penetration testing activity
level: high
