title: SQL Injection Attempt Detected
id: a1000001-0002-4000-8000-000000000002
description: Detects SQL injection patterns in HTTP requests to web applications
references:
    - https://attack.mitre.org/techniques/T1190/
author: CyberNova
date: 2025-01-01
tags:
    - attack.initial_access
    - attack.t1190
logsource:
    category: webserver
    product: generic
detection:
    selection:
        request|contains:
            - "' OR '1'='1"
            - " UNION SELECT "
            - " OR 1=1"
            - "'; DROP TABLE"
            - " WAITFOR DELAY"
            - " SLEEP("
            - " pg_sleep("
            - "'--"
        status|not: 404
    condition: selection
falsepositives:
    - Security scanner traffic
    - Penetration testing
level: high