title: Service Account Access from Untrusted Source
id: a1000001-0035-4000-8000-000000000035
description: Detects service account authentication from untrusted or unexpected sources
references:
    - https://attack.mitre.org/techniques/T1199/
author: CyberNova
date: 2025-01-01
tags:
    - attack.initial_access
    - attack.t1199
logsource:
    category: authentication
    product: windows
detection:
    selection:
        EventID: 4624
        LogonType: 3
        TargetUserName|endswith: $
        SourceWorkstation|notcontains:
            - DOMAIN
            - CORP
    condition: selection
falsepositives:
    - Service account used in DMZ or perimeter network
    - Legacy application cross-domain authentication
level: high
