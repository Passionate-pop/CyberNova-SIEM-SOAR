title: LSASS Process Access - Mimikatz Pattern
id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
description: Detects suspicious access to LSASS process memory (credential dumping)
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        CallTrace|contains:
            - 'dbghelp.dll'
            - 'minidump'
            - 'dbgcore.dll'
    condition: selection
falsepositives:
    - Legitimate LSASS access by AV tools
level: critical
