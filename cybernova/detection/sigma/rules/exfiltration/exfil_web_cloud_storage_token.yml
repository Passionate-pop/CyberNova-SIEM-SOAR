title: Cloud Storage API Token Used for Exfiltration
id: a1000011-0014-4000-8000-000000000014
description: Detects usage of cloud storage API access tokens or OAuth flows from non-standard applications which may indicate token theft for exfiltration
references:
    - https://attack.mitre.org/techniques/T1567/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.exfiltration
    - attack.t1567
    - attack.t1567.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'access_token'
            - 'refresh_token'
            - 'client_secret'
            - 'Authorization: Bearer'
        CommandLine|contains|all:
            - 'api.'
            - 'upload'
            - 'files'
    condition: selection
falsepositives:
    - Legitimate automation scripts using service accounts
    - CI/CD pipelines deploying artifacts to cloud storage
level: high
