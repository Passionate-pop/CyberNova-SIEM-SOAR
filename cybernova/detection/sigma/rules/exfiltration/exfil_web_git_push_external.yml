title: Git Push to External Private Repository
id: a1000011-0011-4000-8000-000000000011
description: Detects git push operations to external non-enterprise repositories which may indicate source code or data exfiltration
references:
    - https://attack.mitre.org/techniques/T1567/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.exfiltration
    - attack.t1567
    - attack.t1567.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\git.exe'
        CommandLine|contains|all:
            - 'push'
            - 'github.com'
            - 'gitlab.com'
            - 'bitbucket.org'
        CommandLine|contains:
            - 'https://'
            - 'git@'
    condition: selection
falsepositives:
    - Developers pushing to legitimate personal repositories
    - Automated CI/CD pipeline operations
level: low
