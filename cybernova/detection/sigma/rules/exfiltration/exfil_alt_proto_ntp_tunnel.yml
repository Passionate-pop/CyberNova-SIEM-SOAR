title: NTP Tunneling for Data Exfiltration
id: a1000011-0009-4000-8000-000000000009
description: Detects anomalous NTP traffic with irregular payload sizes or query patterns that may indicate data tunneling
references:
    - https://attack.mitre.org/techniques/T1048/004/
author: CyberNova
date: 2025-01-01
tags:
    - attack.exfiltration
    - attack.t1048
    - attack.t1048.004
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Protocol: 'NTP'
        DestinationPort: 123
        PacketSize|gte: 90
    condition: selection
falsepositives:
    - NTP monitoring tools querying time servers with extended data
    - Misconfigured NTP clients
level: low
