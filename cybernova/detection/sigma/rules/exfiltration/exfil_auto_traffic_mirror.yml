title: Network Traffic Mirroring or Port Mirror Enabled
id: a1000011-0019-4000-8000-000000000019
description: Detects enabling of port mirroring or traffic duplication features on network interfaces which may be used to exfiltrate network traffic
references:
    - https://attack.mitre.org/techniques/T1020/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.exfiltration
    - attack.t1020
    - attack.t1020.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\netsh.exe'
        CommandLine|contains|all:
            - 'bridge'
            - 'add'
        CommandLine|contains:
            - 'mirror'
            - 'monitor'
    condition: selection
falsepositives:
    - Network administrators enabling port mirroring for legitimate monitoring
    - IDS/IPS sensor deployment
level: low
