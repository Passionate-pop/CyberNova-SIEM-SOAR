title: Cron Job for Periodic Data Exfiltration
id: a1000011-0020-4000-8000-000000000020
description: Detects creation of cron jobs or task scheduler entries that periodically execute data transfer commands to external systems
references:
    - https://attack.mitre.org/techniques/T1020/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.exfiltration
    - attack.t1020
    - attack.t1020.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/CREATE'
            - '/TR'
            - '/SC'
            - 'DAILY'
            - 'HOURLY'
            - 'MINUTE'
        CommandLine|contains:
            - 'curl'
            - 'wget'
            - 'powershell'
            - 'Invoke-WebRequest'
            - 'ftp'
            - 'net use'
            - 'copy'
    condition: selection
falsepositives:
    - Legitimate recurring maintenance or reporting tasks
    - Scheduled database or log backups to remote locations
level: high
