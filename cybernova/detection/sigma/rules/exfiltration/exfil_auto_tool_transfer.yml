title: Automated Transfer Tool Execution
id: a1000011-0017-4000-8000-000000000017
description: Detects execution of known bulk file transfer tools (rclone, rsync, scp) targeting external destinations with large data volumes
references:
    - https://attack.mitre.org/techniques/T1020/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.exfiltration
    - attack.t1020
    - attack.t1020.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\rclone.exe'
            - '\rsync.exe'
            - '\scp.exe'
            - '\pscp.exe'
            - '\winscp.exe'
        CommandLine|contains:
            - '@'
            - '--remote'
            - 'copy'
            - 'sync'
    condition: selection
falsepositives:
    - Authorized backup or migration scripts using these tools
    - System administrators performing legitimate file transfers
level: high
