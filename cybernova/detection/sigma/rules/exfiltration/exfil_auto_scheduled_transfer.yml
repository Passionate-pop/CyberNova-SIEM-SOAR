title: Scheduled Task for Data Transfer
id: a1000011-0018-4000-8000-000000000018
description: Detects creation of scheduled tasks that execute file transfer tools to external destinations, indicating automated exfiltration
references:
    - https://attack.mitre.org/techniques/T1020/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.exfiltration
    - attack.t1020
    - attack.t1020.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/CREATE'
            - '/TR'
        CommandLine|contains:
            - 'rclone'
            - 'rsync'
            - 'scp'
            - 'ftp'
            - 'curl'
            - 'wget'
            - 'powershell'
    condition: selection
falsepositives:
    - Legitimate scheduled backup tasks configured by IT
    - Maintenance scripts for log shipping or replication
level: high
