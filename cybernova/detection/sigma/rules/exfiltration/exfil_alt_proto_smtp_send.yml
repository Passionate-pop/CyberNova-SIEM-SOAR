title: Email with Large Attachment to External Domain
id: a1000011-0007-4000-8000-000000000007
description: Detects outbound emails with large attachments sent to external domains which may indicate data exfiltration
references:
    - https://attack.mitre.org/techniques/T1048/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.exfiltration
    - attack.t1048
    - attack.t1048.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\outlook.exe'
            - '\powershell.exe'
            - '\Send-MailMessage.exe'
        CommandLine|contains:
            - '.zip'
            - '.rar'
            - '\attachment'
            - '-Attachments'
        CommandLine|contains|all:
            - '@'
            - '.com'
            - '.org'
    condition: selection
falsepositives:
    - Legitimate business email with large attachments
    - Automated reporting via email
level: medium
