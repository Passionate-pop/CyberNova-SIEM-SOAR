title: ICMP Echo Request with Data Payload
id: a1000011-0008-4000-8000-000000000008
description: Detects ICMP echo requests with unusually large data payloads which may indicate ICMP tunneling for data exfiltration
references:
    - https://attack.mitre.org/techniques/T1048/004/
author: CyberNova
date: 2025-01-01
tags:
    - attack.exfiltration
    - attack.t1048
    - attack.t1048.004
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Protocol: 'ICMP'
        ICMPType: 8
        DataLength|gte: 64
    condition: selection
falsepositives:
    - Network diagnostic tools using large ping packets
    - MTU discovery and path validation
level: low
