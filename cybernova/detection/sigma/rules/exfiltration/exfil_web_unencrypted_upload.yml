title: HTTP Upload of Sensitive File Types
id: a1000011-0015-4000-8000-000000000015
description: Detects HTTP POST requests containing sensitive file types sent to external destinations over unencrypted HTTP
references:
    - https://attack.mitre.org/techniques/T1567/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.exfiltration
    - attack.t1567
    - attack.t1567.003
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Initiated: 'true'
        DestinationPort: 80
        Method: 'POST'
        FileExtension:
            - '.zip'
            - '.rar'
            - '.7z'
            - '.tar.gz'
            - '.doc'
            - '.docx'
            - '.xls'
            - '.xlsx'
            - '.pdf'
            - '.sql'
            - '.bak'
            - '.mdf'
            - '.ldf'
    condition: selection
falsepositives:
    - Legacy web applications that do not enforce HTTPS
    - Internal file upload portals
level: high
