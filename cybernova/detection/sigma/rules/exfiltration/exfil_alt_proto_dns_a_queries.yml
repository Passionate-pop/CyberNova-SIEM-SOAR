title: DNS A Query Subdomain Encoding Exfiltration
id: a1000011-0002-4000-8000-000000000002
description: Detects DNS A queries with subdomains containing high entropy or encoded payloads indicative of data exfiltration
references:
    - https://attack.mitre.org/techniques/T1048/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.exfiltration
    - attack.t1048
    - attack.t1048.001
logsource:
    category: dns
    product: windows
detection:
    selection:
        QueryType: 'A'
        SubdomainLength|gte: 40
        SubdomainEntropy|gte: 4.5
    condition: selection
falsepositives:
    - Long legitimate hostnames from CDN providers
    - Dynamic DNS services with generated names
level: medium
