title: Disk Wiping Tool Execution
id: a1000012-0011-4000-8000-000000000011
description: Detects execution of disk wiping utilities including dd, diskpart clean, ccleaner -wipe, and other tools used to destroy data on disk, a common data destruction tactic.
references:
    - https://attack.mitre.org/techniques/T1485/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.impact
    - attack.t1485.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_diskpart:
        Image|endswith: '\diskpart.exe'
        CommandLine|contains:
            - 'clean'
            - 'clean all'
    selection_ccleaner:
        Image|endswith: '\ccleaner.exe'
        CommandLine|contains:
            - 'wipe'
            - '/auto'
    selection_dd:
        CommandLine|contains:
            - 'dd if='
            - 'dd.exe'
            - 'if=/dev/zero'
            - 'if=/dev/urandom'
    selection_format:
        Image|endswith: '\format.com'
        CommandLine|contains:
            - '/P:'
            - '/Q'
    condition: 1 of selection_*
falsepositives:
    - Authorized disk decommissioning procedures
    - IT staff performing clean disk wipes for hardware disposal
    - Forensic imaging tools using dd
level: high
