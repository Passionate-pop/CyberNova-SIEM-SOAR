title: System Restore Points Disabled or Cleared
id: a1000012-0022-4000-8000-000000000022
description: Detects attempts to disable or clear system restore points via registry modifications, WMI calls, or command-line tools to prevent system recovery.
references:
    - https://attack.mitre.org/techniques/T1490/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.impact
    - attack.t1490.002
logsource:
    category: registry_event
    product: windows
detection:
    selection_disable:
        EventID: 13
        TargetObject|contains: 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\SystemRestore'
        Details: '0'
    selection_disable_rpsession:
        EventID: 13
        TargetObject|endswith: 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\SystemRestore\RPSessionInterval'
    selection_clear_restore:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains|all:
            - 'delete'
            - 'shadows'
            - '/all'
    selection_wmi_restore:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'SystemRestore'
            - 'Disable'
    selection_disable_ps:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'Disable-ComputerRestore'
            - '-Drive'
    condition: 1 of selection_*
falsepositives:
    - IT administrative scripts managing restore points
    - Group Policy enforcing system restore configurations
    - System optimization or cleanup utilities
level: high
