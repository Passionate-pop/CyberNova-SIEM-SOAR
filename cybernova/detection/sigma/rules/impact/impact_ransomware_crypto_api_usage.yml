title: Abnormal CryptoAPI Usage Pattern
id: a1000012-0005-4000-8000-000000000005
description: Detects abnormal patterns of CryptoAPI calls from non-standard processes, such as repeated CryptEncrypt calls on many files, which may indicate ransomware encryption activity.
references:
    - https://attack.mitre.org/techniques/T1486/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.impact
    - attack.t1486.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
        CommandLine|contains:
            - 'System.Security.Cryptography'
            - 'RijndaelManaged'
            - 'AesCryptoServiceProvider'
            - 'CryptEncrypt'
            - 'CreateEncryptor'
            - 'System.IO.File.WriteAllBytes'
    condition: selection
falsepositives:
    - Administrative scripts performing legitimate encryption
    - Software installers using encryption for licensing
    - AppLocker or security tooling
level: medium
