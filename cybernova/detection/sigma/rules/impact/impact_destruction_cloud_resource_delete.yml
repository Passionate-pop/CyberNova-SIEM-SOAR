title: Bulk Cloud Resource Deletion
id: a1000012-0016-4000-8000-000000000016
description: Detects bulk deletion of cloud infrastructure resources such as virtual machines, storage buckets, databases, or other cloud services, indicating intentional data destruction.
references:
    - https://attack.mitre.org/techniques/T1485/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.impact
    - attack.t1485.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_az_delete:
        CommandLine|contains:
            - 'az vm delete'
            - 'az storage account delete'
            - 'az group delete'
            - 'az resource delete'
            - '--yes'
            - '--no-wait'
    selection_aws_delete:
        CommandLine|contains:
            - 'aws s3 rb'
            - 'aws s3api delete-bucket'
            - 'aws ec2 terminate-instances'
            - 'aws rds delete-db-instance'
            - '--force'
    selection_gcloud:
        CommandLine|contains:
            - 'gcloud compute instances delete'
            - 'gcloud storage buckets delete'
            - 'gcloud sql instances delete'
            - '--quiet'
    selection_ps_azure:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'Remove-AzResourceGroup'
            - '-Force'
    condition: 1 of selection_*
falsepositives:
    - Authorized cloud resource cleanup and decommissioning
    - Infrastructure-as-Code automation tear-down scripts
    - DevOps operations for temporary environments
level: high
