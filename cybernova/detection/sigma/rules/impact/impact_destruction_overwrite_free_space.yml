title: Free Space Overwrite Detected
id: a1000012-0018-4000-8000-000000000018
description: Detects tools overwriting free disk space, such as cipher /w, sdelete -c, or similar utilities, which may indicate data remnants being destroyed pre-emptively.
references:
    - https://attack.mitre.org/techniques/T1485/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.impact
    - attack.t1485.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_cipher_w:
        Image|endswith: '\cipher.exe'
        CommandLine|contains:
            - '/w:'
            - '/w'
    selection_sdelete_c:
        Image|endswith: '\sdelete.exe'
        CommandLine|contains:
            - '-c'
            - '-z'
    selection_sdelete64_c:
        Image|endswith: '\sdelete64.exe'
        CommandLine|contains:
            - '-c'
            - '-z'
    selection_powershell_overwrite:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'Get-Random'
            - 'Set-Content'
            - 'WriteBytes'
            - 'FileStream'
    condition: 1 of selection_*
falsepositives:
    - Scheduled disk maintenance and cleanup tasks
    - Compliance-driven data sanitization procedures
    - Forensic preparation of disk images
level: medium
