title: BlackCat/ALPHV Ransomware Specific IOCs
id: a1000012-0009-4000-8000-000000000009
description: Detects BlackCat/ALPHV ransomware-specific indicators including Rust-based binary characteristics, known command-line arguments, ransom note patterns, and network share enumeration.
references:
    - https://attack.mitre.org/techniques/T1486/003/
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-165a
author: CyberNova
date: 2025-01-01
tags:
    - attack.impact
    - attack.t1486.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_cli:
        CommandLine|contains|all:
            - '--encrypt'
            - '--no-vm'
            - '--no-net'
            - '--no-daemon'
    selection_ext:
        TargetFilename|endswith:
            - '.alphv'
            - '.blackcat'
    selection_ransomnote:
        TargetFilename|contains:
            - 'ALPHV'
            - 'README'
            - 'blackcat'
        TargetFilename|endswith:
            - '.txt'
            - '.html'
    selection_enum:
        Image|endswith: '\cmd.exe'
        CommandLine|contains|all:
            - 'net'
            - 'share'
    condition: 1 of selection_*
falsepositives:
    - Files with coincidental naming patterns
    - Legitimate Rclone usage for file transfers
level: critical
