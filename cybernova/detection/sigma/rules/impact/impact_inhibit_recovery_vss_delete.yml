title: Volume Shadow Copy Service Deletion
id: a1000012-0020-4000-8000-000000000020
description: Detects attempts to delete or disable the Volume Shadow Copy Service (VSS) using tools such as vssadmin, wmic, or direct PowerShell commands to remove system restore points.
references:
    - https://attack.mitre.org/techniques/T1490/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.impact
    - attack.t1490.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_vssadmin:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains|all:
            - 'delete'
            - 'shadows'
    selection_vssadmin_resize:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains|all:
            - 'resize'
            - 'shadowstorage'
            - '/MaxSize='
    selection_wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains|all:
            - 'shadowcopy'
            - 'delete'
    selection_powershell:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'Win32_ShadowCopy'
            - 'Delete()'
    selection_sc_stop:
        Image|endswith: '\sc.exe'
        CommandLine|contains|all:
            - 'stop'
            - 'VSS'
    condition: 1 of selection_*
falsepositives:
    - Backup software managing shadow storage allocation
    - System administrators reclaiming disk space
    - Scheduled VSS maintenance tasks
level: high
