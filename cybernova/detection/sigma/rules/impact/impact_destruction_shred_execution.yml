title: File Shredding Tool Execution
id: a1000012-0017-4000-8000-000000000017
description: Detects execution of file shredding utilities such as shred, sdelete, wipe, and similar tools designed to securely overwrite and destroy file contents.
references:
    - https://attack.mitre.org/techniques/T1485/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.impact
    - attack.t1485.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_sdelete:
        Image|endswith: '\sdelete.exe'
        CommandLine|contains:
            - '-p'
            - '-c'
            - '-z'
            - '-a'
    selection_sdelete64:
        Image|endswith: '\sdelete64.exe'
    selection_shred:
        CommandLine|contains:
            - 'shred'
            - '-z'
            - '-n'
            - '-u'
            - '--remove'
    selection_wipe:
        CommandLine|contains:
            - 'wipe'
            - '-rf'
            - '-f'
        Image|endswith: '\wipe.exe'
    selection_cipher:
        Image|endswith: '\cipher.exe'
        CommandLine|contains:
            - '/w:'
            - '/w'
    condition: 1 of selection_*
falsepositives:
    - Authorized data sanitization by IT department
    - Secure file deletion for compliance purposes
    - Digital forensics tools
level: high
