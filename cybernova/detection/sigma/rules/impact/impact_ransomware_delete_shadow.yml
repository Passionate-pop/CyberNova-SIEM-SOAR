title: Volume Shadow Copy Deletion via VSSAdmin or WMIC
id: a1000012-0006-4000-8000-000000000006
description: Detects attempts to delete volume shadow copies using vssadmin.exe, wmic.exe, or similar tools, a common ransomware tactic to prevent system recovery.
references:
    - https://attack.mitre.org/techniques/T1486/002/
    - https://attack.mitre.org/techniques/T1490/
author: CyberNova
date: 2025-01-01
tags:
    - attack.impact
    - attack.t1486.002
    - attack.t1490
logsource:
    category: process_creation
    product: windows
detection:
    selection_vssadmin:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains|all:
            - 'delete'
            - 'shadows'
    selection_wmic:
        Image|endswith: '\WMIC.exe'
        CommandLine|contains|all:
            - 'shadowcopy'
            - 'delete'
    selection_wmi_powershell:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'Get-WmiObject'
            - 'Win32_ShadowCopy'
            - 'Delete()'
    condition: 1 of selection_*
falsepositives:
    - Legitimate administrative cleanup scripts
    - Backup software managing shadow copy retention
    - System maintenance tasks
level: high
