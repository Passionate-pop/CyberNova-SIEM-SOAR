title: LockBit Ransomware Specific IOCs
id: a1000012-0008-4000-8000-000000000008
description: Detects LockBit ransomware-specific indicators including known binary names, ransom note filenames, file extensions, and mutex objects associated with the LockBit family.
references:
    - https://attack.mitre.org/techniques/T1486/003/
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-165a
author: CyberNova
date: 2025-01-01
tags:
    - attack.impact
    - attack.t1486.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith:
            - '\LockBit.exe'
            - '\LB.exe'
            - '\build.exe'
            - '\LB3.exe'
        CommandLine|contains:
            - '-pass'
            - '-lock'
    selection_ext:
        TargetFilename|endswith:
            - '.lockbit'
            - '.lock'
            - '.abcd'
    selection_ransomnote:
        TargetFilename|endswith:
            - '!!!README!!!.txt'
            - 'Restore-My-Files.txt'
            - '!!!AllYourFiles!!!.txt'
    condition: 1 of selection_*
falsepositives:
    - Files named similarly by coincidence
    - Research or sandbox environments
level: critical
