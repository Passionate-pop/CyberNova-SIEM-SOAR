title: Backup File Deletion Detected
id: a1000012-0019-4000-8000-000000000019
description: Detects deletion of backup files or backup directories across the filesystem, a common technique used by ransomware and destructive malware to inhibit system recovery.
references:
    - https://attack.mitre.org/techniques/T1490/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.impact
    - attack.t1490.001
logsource:
    category: file_event
    product: windows
detection:
    selection_backup_ext:
        EventID: 2
        TargetFilename|endswith:
            - '.bak'
            - '.bkf'
            - '.bkp'
            - '.vhd'
            - '.vhdx'
            - '.vmdk'
            - '.avhd'
            - '.wbcat'
            - '.wbs'
    selection_backup_dir:
        EventID: 2
        TargetFilename|contains:
            - '\Backup\'
            - '\WindowsImageBackup\'
            - '\System Volume Information\'
            - '\backups\'
    selection_wbadmin:
        Image|endswith: '\wbadmin.exe'
        CommandLine|contains:
            - 'delete'
            - 'catalog'
    condition: 1 of selection_*
falsepositives:
    - Legitimate backup rotation by backup software
    - IT-administered disk cleanup procedures
    - User deleting old backup files manually
level: high
