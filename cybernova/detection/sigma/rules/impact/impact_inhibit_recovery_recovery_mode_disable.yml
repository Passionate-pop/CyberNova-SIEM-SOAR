title: Recovery Mode or Boot Repair Disabled
id: a1000012-0023-4000-8000-000000000023
description: Detects attempts to disable Windows Recovery Environment (WinRE) or boot repair functionality, preventing the system from booting into recovery mode after corruption.
references:
    - https://attack.mitre.org/techniques/T1490/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.impact
    - attack.t1490.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_reagentc:
        Image|endswith: '\reagentc.exe'
        CommandLine|contains:
            - '/disable'
            - '/info'
    selection_bcdedit_recovery:
        Image|endswith: '\bcdedit.exe'
        CommandLine|contains|all:
            - '/set'
            - 'recoverysequence'
        CommandLine|contains:
            - '{default}'
    selection_bootrepair:
        Image|endswith: '\bcdedit.exe'
        CommandLine|contains:
            - 'bootrepair'
            - 'recovery'
    selection_winre_del:
        Image|endswith: '\cmd.exe'
        CommandLine|contains|all:
            - 'recovery'
            - 'rmdir'
            - '/s'
    selection_recovery_key_deletion:
        CommandLine|contains|all:
            - 'reg'
            - 'delete'
            - 'Recovery'
    condition: 1 of selection_*
falsepositives:
    - System administrators disabling WinRE in managed environments
    - Corporate imaging processes for deployment
    - Disk space reclamation on non-recoverable systems
level: high
