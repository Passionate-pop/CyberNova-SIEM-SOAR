title: Browser Stored Credential Access
id: a1000006-0021-4000-8000-000000000021
description: Detects access to browser credential stores (Chrome, Firefox, Edge login data)
references:
    - https://attack.mitre.org/techniques/T1552/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1552.001
logsource:
    category: file_access
    product: windows
detection:
    selection:
        TargetFilename|contains:
            - '\AppData\Local\Google\Chrome\User Data\Default\Login Data'
            - '\AppData\Roaming\Mozilla\Firefox\Profiles\'
            - '\AppData\Local\Microsoft\Edge\User Data\Default\Login Data'
    condition: selection
falsepositives:
    - Browser normal operation
    - Password manager extensions
level: high
