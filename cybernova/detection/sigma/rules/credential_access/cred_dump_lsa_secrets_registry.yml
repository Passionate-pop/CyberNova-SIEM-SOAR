title: LSA Secrets Registry Read
id: a1000006-0011-4000-8000-000000000011
description: Detects reading of LSA secrets from registry (HKLM\SECURITY\Policy\Secrets)
references:
    - https://attack.mitre.org/techniques/T1003/004/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1003.004
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        TargetObject|contains: '\SECURITY\Policy\Secrets'
        EventType: 'SetValue'
    condition: selection
falsepositives:
    - Security software enumeration
    - System configuration changes
level: high
