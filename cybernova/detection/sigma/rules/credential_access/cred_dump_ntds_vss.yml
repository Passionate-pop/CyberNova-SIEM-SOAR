title: NTDS.dit Access via Volume Shadow Copy
id: a1000006-0010-4000-8000-000000000010
description: Detects NTDS.dit extraction using volume shadow copy
references:
    - https://attack.mitre.org/techniques/T1003/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1003.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains|all:
            - 'ntds.dit'
            - 'shadow'
    condition: selection
falsepositives:
    - Authorized domain backup
    - Disaster recovery testing
level: critical
