title: Windows Credential Manager Vault Access
id: a1000006-0037-4000-8000-000000000037
description: Detects access to Windows Credential Manager vault files
references:
    - https://attack.mitre.org/techniques/T1555/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1555.003
logsource:
    category: file_access
    product: windows
detection:
    selection:
        TargetFilename|contains:
            - '\AppData\Local\Microsoft\Vault\'
            - '\AppData\Roaming\Microsoft\Credentials\'
    condition: selection
falsepositives:
    - Legitimate credential management
    - Windows vault synchronization
level: high
