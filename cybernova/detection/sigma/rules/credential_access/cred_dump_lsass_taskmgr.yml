title: LSASS Memory Dump via Task Manager
id: a1000006-0003-4000-8000-000000000003
description: Detects creation of LSASS process dump file from Windows Task Manager
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|endswith: '\lsass.DMP'
    condition: selection
falsepositives:
    - Administrative troubleshooting
    - Forensic acquisition
level: medium
