title: Group Policy Preferences Password Retrieval
id: a1000006-0029-4000-8000-000000000029
description: Detects access to Group Policy Preference files containing cpassword values
references:
    - https://attack.mitre.org/techniques/T1552/006/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1552.006
logsource:
    category: file_access
    product: windows
detection:
    selection:
        TargetFilename|contains|all:
            - '\SYSVOL\'
            - 'cpassword'
        TargetFilename|endswith:
            - 'Groups.xml'
            - 'Services.xml'
            - 'ScheduledTasks.xml'
    condition: selection
falsepositives:
    - Legitimate Group Policy management
domain: domain
level: high
