title: macOS Keychain Dump via security Command
id: a1000006-0034-4000-8000-000000000034
description: Detects dumping of macOS keychain contents using security dump-keychain command
references:
    - https://attack.mitre.org/techniques/T1555/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1555.001
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        CommandLine|contains|all:
            - 'security'
            - 'dump-keychain'
    condition: selection
falsepositives:
    - Keychain migration
    - Backup and restore operations
level: high
