title: Third-Party Password Manager Process Access
id: a1000006-0042-4000-8000-000000000042
description: Detects access to third-party password manager processes (1Password, LastPass, Dashlane, Bitwarden)
references:
    - https://attack.mitre.org/techniques/T1555/005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1555.005
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith:
            - '\1Password.exe'
            - '\LastPass.exe'
            - '\Dashlane.exe'
            - '\Bitwarden.exe'
            - '\KeePass.exe'
    condition: selection
falsepositives:
    - Updater processes
    - Legitimate integration plugins
level: high
