title: DCSync Attack Detection
id: a1000006-0014-4000-8000-000000000014
description: Detects DCSync attack via DRSUAPI directory replication requests
references:
    - https://attack.mitre.org/techniques/T1003/006/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1003.006
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains|all:
            - 'lsadump::dcsync'
            - 'mimikatz'
    condition: selection
falsepositives:
    - Authorized domain replication tests
level: critical
