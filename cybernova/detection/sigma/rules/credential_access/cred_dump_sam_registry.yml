title: SAM Registry Hive Export
id: a1000006-0006-4000-8000-000000000006
description: Detects export of SAM registry hive using reg.exe or other registry tools
references:
    - https://attack.mitre.org/techniques/T1003/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1003.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains|all:
            - 'reg'
            - 'save'
            - 'SAM'
    condition: selection
falsepositives:
    - Backup operations
    - Forensic investigations
level: high
