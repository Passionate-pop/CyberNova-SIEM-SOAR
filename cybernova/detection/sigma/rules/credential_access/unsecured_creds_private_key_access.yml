title: Private Key File Access
id: a1000006-0026-4000-8000-000000000026
description: Detects access to private key files (.key, .pem, .pfx, .p12)
references:
    - https://attack.mitre.org/techniques/T1552/004/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1552.004
logsource:
    category: file_access
    product: linux
detection:
    selection:
        TargetFilename|endswith:
            - '.key'
            - '.pem'
            - '.pfx'
            - '.p12'
            - '.ppk'
            - '.cert'
    condition: selection
falsepositives:
    - Certificate renewal operations
    - SSL/TLS configuration
level: medium
