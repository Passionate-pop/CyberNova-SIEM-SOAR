title: LSA Secrets Remote Retrieval
id: a1000006-0012-4000-8000-000000000012
description: Detects remote LSA secret retrieval via LSARPC or similar methods
references:
    - https://attack.mitre.org/techniques/T1003/004/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1003.004
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Initiated: 'true'
        DestinationPort: 49664
        DestinationIp|startswith:
            - '192.168.'
            - '10.'
            - '172.'
    condition: selection
falsepositives:
    - Legitimate remote administration
level: medium
