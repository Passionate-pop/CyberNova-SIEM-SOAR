title: Cloud Instance Metadata Service Access
id: a1000006-0018-4000-8000-000000000018
description: Detects access to cloud instance metadata service (IMDS) for credential retrieval
references:
    - https://attack.mitre.org/techniques/T1003/009/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1003.009
logsource:
    category: network_connection
    product: linux
detection:
    selection:
        DestinationIp:
            - '169.254.169.254'
            - '100.100.100.200'
        DestinationPort: 80
    condition: selection
falsepositives:
    - Cloud-init scripts
    - Instance metadata queries by authorized tools
level: high
