title: LSASS Memory Dump via Procdump
id: a1000006-0001-4000-8000-000000000001
description: Detects LSASS process memory dump using procdump or procdump64
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\procdump.exe'
            - '\procdump64.exe'
        CommandLine|contains:
            - 'lsass'
            - 'lsass.exe'
    condition: selection
falsepositives:
    - Administrative troubleshooting
    - Authorized incident response
level: high
