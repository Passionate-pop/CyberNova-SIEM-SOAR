title: Windows Hello PIN Brute Force
id: a1000006-0039-4000-8000-000000000039
description: Detects multiple failed Windows Hello PIN authentication attempts indicating brute force
references:
    - https://attack.mitre.org/techniques/T1555/004/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1555.004
logsource:
    category: authentication
    product: windows
detection:
    selection:
        EventID: 4818
        LogonProcessName: 'WinHello'
    selection_threshold:
        EventID: 4818
        AttemptCount|gte: 10
    condition: selection and selection_threshold
falsepositives:
    - User forgetting PIN
    - Hardware issues with PIN entry
level: medium
