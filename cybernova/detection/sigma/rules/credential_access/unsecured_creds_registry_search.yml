title: Registry Search for Credentials
id: a1000006-0024-4000-8000-000000000024
description: Detects searching registry for passwords or secret keys
references:
    - https://attack.mitre.org/techniques/T1552/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1552.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains|all:
            - 'reg'
            - 'query'
        CommandLine|contains:
            - 'password'
            - 'secret'
            - 'cred'
            - 'key'
    condition: selection
falsepositives:
    - System administration
    - Security audits
level: medium
