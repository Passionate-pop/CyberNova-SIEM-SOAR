title: Container Registry and Secret Enumeration
id: a1000006-0030-4000-8000-000000000030
description: Detects enumeration of container secrets or registry credentials via Docker or Kubernetes API
references:
    - https://attack.mitre.org/techniques/T1552/007/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1552.007
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains|all:
            - 'kubectl'
            - 'get'
            - 'secrets'
    condition: selection
falsepositives:
    - Kubernetes administration
    - CI/CD pipeline operations
level: medium
