title: Browser Password Manager Export
id: a1000006-0040-4000-8000-000000000040
description: Detects export of browser built-in password manager data
references:
    - https://attack.mitre.org/techniques/T1555/005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1555.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains|all:
            - 'chrome://settings/passwords'
            - 'edge://settings/passwords'
    condition: selection
falsepositives:
    - User password management
    - Browser synchronization
level: medium
