title: LSASS Memory Dump via Comsvcs.dll
id: a1000006-0002-4000-8000-000000000002
description: Detects LSASS process memory dump using comsvcs.dll's MiniDump function via rundll32
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains|all:
            - 'comsvcs.dll'
            - 'MiniDump'
            - 'lsass'
    condition: selection
falsepositives:
    - Legitimate debugging activities
level: high
