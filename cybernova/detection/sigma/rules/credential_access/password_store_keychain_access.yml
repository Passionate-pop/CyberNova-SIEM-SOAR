title: Unauthorized Keychain Item Access
id: a1000006-0035-4000-8000-000000000035
description: Detects unauthorized access to macOS keychain items via security find-internet-password or similar
references:
    - https://attack.mitre.org/techniques/T1555/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1555.001
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        CommandLine|contains|all:
            - 'security'
            - 'find-'
            - 'password'
    condition: selection
falsepositives:
    - Development tools
    - Password manager integrations
level: high
