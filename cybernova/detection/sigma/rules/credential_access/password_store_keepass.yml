title: KeePass Database Access Export
id: a1000006-0041-4000-8000-000000000041
description: Detects access or export of KeePass database files (.kdbx)
references:
    - https://attack.mitre.org/techniques/T1555/005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1555.005
logsource:
    category: file_access
    product: windows
detection:
    selection:
        TargetFilename|endswith: '.kdbx'
    condition: selection
falsepositives:
    - Authorized KeePass usage
    - Backup operations
level: high
