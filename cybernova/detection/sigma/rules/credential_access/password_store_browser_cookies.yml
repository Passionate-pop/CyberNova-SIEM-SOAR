title: Browser Cookie Store Access
id: a1000006-0044-4000-8000-000000000044
description: Detects access to browser cookie stores for credential reuse or session hijacking
references:
    - https://attack.mitre.org/techniques/T1555/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1555
logsource:
    category: file_access
    product: windows
detection:
    selection:
        TargetFilename|contains:
            - '\Cookies'
            - 'Cookies.db'
            - 'cookies.sqlite'
            - '\Network\Cookies'
    condition: selection
falsepositives:
    - Browser normal operations
    - Cookie management extensions
level: medium
