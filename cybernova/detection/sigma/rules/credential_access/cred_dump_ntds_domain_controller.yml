title: NTDS.dit File Access
id: a1000006-0009-4000-8000-000000000009
description: Detects access to NTDS.dit file on domain controllers
references:
    - https://attack.mitre.org/techniques/T1003/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1003.003
logsource:
    category: file_access
    product: windows
detection:
    selection:
        TargetFilename|endswith: '\ntds.dit'
    condition: selection
falsepositives:
    - Legitimate backup operations
    - Active Directory database maintenance
level: critical
