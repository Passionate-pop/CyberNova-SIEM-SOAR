title: Windows Vault Enumeration via CLI Tools
id: a1000006-0038-4000-8000-000000000038
description: Detects enumeration of Windows Credential Manager using cmdkey or vaultcmd commands
references:
    - https://attack.mitre.org/techniques/T1555/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1555.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'cmdkey /list'
            - 'vaultcmd /list'
            - 'vaultcmd /listcreds'
    condition: selection
falsepositives:
    - System administration
    - User credential management
level: medium
