title: /proc Filesystem Credential Scraping
id: a1000006-0015-4000-8000-000000000015
description: Detects reading of /proc filesystem entries to scrape process memory for credentials on Linux
references:
    - https://attack.mitre.org/techniques/T1003/007/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1003.007
logsource:
    category: file_read
    product: linux
detection:
    selection:
        FilePath|contains:
            - '/proc/'
            - '/mem'
        ProcessName|endswith:
            - '/cat'
            - '/dd'
            - '/gcore'
    condition: selection
falsepositives:
    - Debugging activities
    - System monitoring tools
level: medium
