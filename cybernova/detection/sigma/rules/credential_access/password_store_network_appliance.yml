title: Network Appliance Config Credential Extraction
id: a1000006-0045-4000-8000-000000000045
description: Detects extraction of credentials from network appliance configuration files
references:
    - https://attack.mitre.org/techniques/T1555/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1555
logsource:
    category: file_access
    product: linux
detection:
    selection:
        TargetFilename|contains:
            - '/config/'
            - '/running-config'
            - '/startup-config'
        TargetFilename|endswith:
            - '.cfg'
            - '.conf'
            - '.config'
    condition: selection
falsepositives:
    - Authorized network administration
    - Configuration backup tools
level: medium
