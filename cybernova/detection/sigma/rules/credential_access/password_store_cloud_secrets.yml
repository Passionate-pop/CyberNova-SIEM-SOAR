title: Cloud Secrets Manager Enumeration
id: a1000006-0043-4000-8000-000000000043
description: Detects enumeration of cloud secrets manager services (AWS Secrets Manager, GCP Secret Manager, Azure Key Vault)
references:
    - https://attack.mitre.org/techniques/T1555/006/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1555.006
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'aws secretsmanager'
            - 'gcloud secrets'
            - 'az keyvault secret'
    condition: selection
falsepositives:
    - Cloud infrastructure management
    - CI/CD secret retrieval
level: high
