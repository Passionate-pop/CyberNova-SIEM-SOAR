title: SAM File Copy
id: a1000006-0007-4000-8000-000000000007
description: Detects copying of SAM, SYSTEM, and SECURITY registry hive files from %SystemRoot%\System32\config
references:
    - https://attack.mitre.org/techniques/T1003/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1003.002
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|contains:
            - '\config\SAM'
            - '\config\SYSTEM'
            - '\config\SECURITY'
    condition: selection
falsepositives:
    - Backup software
    - System restore operations
level: high
