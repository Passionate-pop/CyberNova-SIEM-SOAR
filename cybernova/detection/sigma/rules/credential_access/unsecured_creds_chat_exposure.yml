title: Credentials Exposed in Chat Logs
id: a1000006-0031-4000-8000-000000000031
description: Detects credential patterns in chat application logs or memory
references:
    - https://attack.mitre.org/techniques/T1552/008/
author: CyberNova
date: 2025-01-01
tags:
    - attack.credential_access
    - attack.t1552.008
logsource:
    category: file_access
    product: windows
detection:
    selection_chat_paths:
        TargetFilename|contains:
            - '\Slack\'
            - '\Discord\'
            - '\Teams\'
            - '\Telegram\'
    selection_extensions:
        TargetFilename|endswith:
            - '.log'
            - '.db'
            - '.json'
    condition: selection_chat_paths and selection_extensions
falsepositives:
    - Chat application normal operation
    - Log archiving tools
level: low
