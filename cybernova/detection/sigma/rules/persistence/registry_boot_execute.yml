title: BootExecute Registry Value Modification
id: a1000003-0006-4000-8000-000000000006
description: Detects modification to BootExecute registry value for boot-time persistence
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1547
    - attack.t1547.001
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        TargetObject|contains: 'Session Manager\BootExecute'
    condition: selection
falsepositives:
    - Chkdsk configuration changes
    - Legitimate boot-time antivirus scanners
level: high
