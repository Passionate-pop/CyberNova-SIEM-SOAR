title: Winlogon Shell or Userinit Modification
id: a1000003-0014-4000-8000-000000000014
description: Detects modification to Winlogon Shell or Userinit values for logon persistence
references:
    - https://attack.mitre.org/techniques/T1547/004/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1547
    - attack.t1547.004
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        TargetObject|contains:
            - 'Winlogon\Shell'
            - 'Winlogon\Userinit'
    condition: selection
falsepositives:
    - Legitimate shell replacement software
    - Enterprise desktop management tools
level: high
