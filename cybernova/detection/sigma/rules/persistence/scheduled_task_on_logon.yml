title: Scheduled Task Triggered at Logon
id: a1000003-0036-4000-8000-000000000036
description: Detects scheduled tasks configured to trigger at user logon for persistence
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1053
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    selection_logon:
        CommandLine|contains:
            - 'ONLOGON'
            - 'AT LOGON'
            - 'ONIDLE'
    condition: selection and selection_logon
falsepositives:
    - Legitimate user logon scripts
    - Software auto-start configuration
level: medium
