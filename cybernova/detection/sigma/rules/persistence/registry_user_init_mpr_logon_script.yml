title: UserInitMprLogonScript Registry Persistence
id: a1000003-0005-4000-8000-000000000005
description: Detects setting of UserInitMprLogonScript value for logon script persistence
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1547
    - attack.t1547.001
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        TargetObject|contains: 'UserInitMprLogonScript'
    condition: selection
falsepositives:
    - Legitimate enterprise logon script configuration
    - VPN client configurations
level: high
