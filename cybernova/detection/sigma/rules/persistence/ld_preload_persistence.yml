title: LD_PRELOAD / ld.so.preload Persistence
id: a1000003-0023-4000-8000-000000000023
description: Detects modification to LD_PRELOAD or ld.so.preload for shared library injection persistence
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1547
    - attack.t1547.001
logsource:
    category: file_event
    product: linux
detection:
    selection:
        TargetFilename|endswith: '/etc/ld.so.preload'
    condition: selection
falsepositives:
    - Legitimate library preloading for performance
    - System administration debugging activities
level: high
