title: Scheduled Task Running Regsvr32
id: a1000003-0032-4000-8000-000000000032
description: Detects scheduled tasks configured to execute regsvr32 for persistence
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1053
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        TaskContent|contains: 'regsvr32'
    condition: selection
falsepositives:
    - Legitimate COM registration tasks
    - Software installers using regsvr32
level: medium
