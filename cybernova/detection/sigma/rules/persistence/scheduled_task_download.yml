title: Scheduled Task Downloading Payload
id: a1000003-0034-4000-8000-000000000034
description: Detects scheduled tasks configured to download remote payloads
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1053
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        TaskContent|contains:
            - 'certutil -urlcache'
            - 'bitsadmin'
            - 'wget'
            - 'curl'
            - 'Invoke-WebRequest'
            - 'Start-BitsTransfer'
    condition: selection
falsepositives:
    - Legitimate software update tasks
    - IT management tools downloading updates
level: high
