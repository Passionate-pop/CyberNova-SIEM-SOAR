title: Suspicious Scheduled Task Creation
id: a1000003-0030-4000-8000-000000000030
description: Detects suspicious scheduled task creation via EventID 4698 with unusual task content
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1053
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        EventID: 4698
        TaskContent|contains:
            - 'powershell'
            - 'cmd'
            - 'wscript'
            - 'cscript'
            - 'mshta'
            - 'regsvr32'
    condition: selection
falsepositives:
    - Legitimate administrative task creation
    - Software installer creating tasks
level: high
