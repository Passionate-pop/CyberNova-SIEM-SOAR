title: Authentication Package Registry Modification
id: a1000003-0011-4000-8000-000000000011
description: Detects modification to Authentication Packages registry value for credential harvesting persistence
references:
    - https://attack.mitre.org/techniques/T1547/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1547
    - attack.t1547.002
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        TargetObject|contains: 'Authentication Packages'
    condition: selection
falsepositives:
    - Legitimate third-party authentication software
    - Security software modifying auth packages
level: high
