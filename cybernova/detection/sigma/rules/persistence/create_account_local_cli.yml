title: Local Account Creation via CLI
id: a1000003-0041-4000-8000-000000000041
description: Detects local account creation via command-line tools like net.exe or lusrmgr
references:
    - https://attack.mitre.org/techniques/T1136/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1136
    - attack.t1136.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|contains:
            - 'user'
            - '/add'
    condition: selection
falsepositives:
    - IT support creating legitimate user accounts
    - Employee onboarding processes
level: high
