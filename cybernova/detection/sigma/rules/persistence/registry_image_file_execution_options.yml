title: Image File Execution Options IFEO Persistence
id: a1000003-0009-4000-8000-000000000009
description: Detects modification to Image File Execution Options Debugger value for persistence
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1547
