title: Service Auto-Start with Image Change
id: a1000003-0020-4000-8000-000000000020
description: Detects service configured for auto-start with an image path change indicating persistence
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1547
    - attack.t1547.001
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        TargetObject|contains: 'Services\'
        TargetObject|endswith: '\Start'
        Details: '4'
    condition: selection
falsepositives:
    - Legitimate service installation
    - System administrator service configuration
level: medium
