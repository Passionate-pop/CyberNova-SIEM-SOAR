title: Local User Added to Administrators Group
id: a1000003-0044-4000-8000-000000000044
description: Detects a local user being added to the local administrators group
references:
    - https://attack.mitre.org/techniques/T1136/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1136
    - attack.t1136.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|contains:
            - 'localgroup'
            - 'Administrators'
            - '/add'
    condition: selection
falsepositives:
    - Legitimate IT administrator group management
    - Software installation requiring admin rights
level: high
