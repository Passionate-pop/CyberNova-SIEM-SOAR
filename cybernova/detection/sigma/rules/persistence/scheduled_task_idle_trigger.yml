title: Scheduled Task with Idle Trigger
id: a1000003-0037-4000-8000-000000000037
description: Detects scheduled tasks configured with idle time triggers for stealthy execution
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1053
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        TaskContent|contains: 'IdleTrigger'
    condition: selection
falsepositives:
    - Legitimate maintenance tasks during idle
    - Power management configurations
level: low
