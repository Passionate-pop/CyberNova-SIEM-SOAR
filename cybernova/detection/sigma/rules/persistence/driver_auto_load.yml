title: Kernel Driver Auto-Load Registration
id: a1000003-0021-4000-8000-000000000021
description: Detects registration of a kernel driver for auto-load at system boot
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1547
    - attack.t1547.001
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        TargetObject|contains: 'Services\'
        TargetObject|endswith: '\ImagePath'
        Details|endswith: '.sys'
    condition: selection
falsepositives:
    - Legitimate hardware driver installation
    - System update driver deployment
level: high
