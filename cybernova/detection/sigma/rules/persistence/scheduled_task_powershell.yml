title: Scheduled Task Running PowerShell with Encoded Command
id: a1000003-0033-4000-8000-000000000033
description: Detects scheduled tasks running PowerShell with encoded command parameters
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1053
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        TaskContent|contains:
            - 'powershell'
            - '-EncodedCommand'
            - '-e '
    condition: selection
falsepositives:
    - Administrative scripts using encoded commands
    - Monitoring solutions using PowerShell
level: high
