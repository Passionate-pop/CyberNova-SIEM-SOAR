title: Hidden Scheduled Task Creation
id: a1000003-0031-4000-8000-000000000031
description: Detects creation of hidden scheduled tasks using the hidden flag
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1053
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    selection_hidden:
        CommandLine|contains:
            - '/h'
            - '/f'
            - 'HIDDEN'
    condition: selection and selection_hidden
falsepositives:
    - System administrators hiding legitimate tasks
    - Software installers creating hidden tasks
level: high
