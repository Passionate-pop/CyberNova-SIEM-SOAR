title: Windows AT.exe Scheduled Task Creation
id: a1000003-0027-4000-8000-000000000027
description: Detects creation of scheduled tasks via at.exe for legacy task scheduler persistence
references:
    - https://attack.mitre.org/techniques/T1053/002/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1053
    - attack.t1053.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\at.exe'
    condition: selection
falsepositives:
    - Legacy application compatibility
    - Administrative scripts using at.exe
level: medium
