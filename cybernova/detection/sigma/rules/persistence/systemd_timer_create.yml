title: Systemd Timer Unit Creation
id: a1000003-0038-4000-8000-000000000038
description: Detects creation of systemd timer units for task scheduling persistence on Linux
references:
    - https://attack.mitre.org/techniques/T1053/006/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1053
    - attack.t1053.006
logsource:
    category: file_event
    product: linux
detection:
    selection:
        TargetFilename|contains: '/etc/systemd/system/'
        TargetFilename|endswith: '.timer'
    condition: selection
falsepositives:
    - Legitimate application timer installation
    - System package manager installing timers
level: medium
