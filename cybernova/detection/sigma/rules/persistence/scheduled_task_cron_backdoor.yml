title: Cron Job Backdoor Detection
id: a1000003-0029-4000-8000-000000000029
description: Detects cron job configurations indicative of backdoor persistence
references:
    - https://attack.mitre.org/techniques/T1053/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1053
    - attack.t1053.003
logsource:
    category: file_event
    product: linux
detection:
    selection:
        TargetFilename|endswith: '/crontab'
        TargetFilename|contains: '/var/spool/cron/'
    condition: selection
falsepositives:
    - Administrator scheduling legitimate tasks
    - Automated cron management tools
level: medium
