title: Scheduled Task Configured as SYSTEM
id: a1000003-0035-4000-8000-000000000035
description: Detects scheduled tasks configured to run with SYSTEM privileges
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1053
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains:
            - '/create'
            - '/ru SYSTEM'
    condition: selection
falsepositives:
    - Legitimate system maintenance tasks
    - Software requiring elevated privileges
level: medium
