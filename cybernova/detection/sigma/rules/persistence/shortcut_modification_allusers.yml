title: Shortcut Modification in All Users Startup
id: a1000003-0017-4000-8000-000000000017
description: Detects LNK file modification in All Users startup folder for system-wide persistence
references:
    - https://attack.mitre.org/techniques/T1547/009/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1547
    - attack.t1547.009
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|contains: 'ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp'
        TargetFilename|endswith: '.lnk'
    condition: selection
falsepositives:
    - System administrator deploying software
    - Enterprise software distribution tools
level: high
