title: Registry Run Key Modification - Current User
id: a1000003-0001-4000-8000-000000000001
description: Detects modification to HKCU Run registry key for persistence
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1547
    - attack.t1547.001
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        TargetObject|startswith: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run'
    condition: selection
falsepositives:
    - Legitimate software installation
    - Legitimate user configuration
level: medium
