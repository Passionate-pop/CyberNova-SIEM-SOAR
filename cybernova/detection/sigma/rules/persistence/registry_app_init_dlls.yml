title: AppInit_DLLs Registry Persistence
id: a1000003-0008-4000-8000-000000000008
description: Detects modification to AppInit_DLLs registry key for DLL loading persistence
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1547
    - attack.t1547.001
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        TargetObject|contains: 'AppInit_DLLs'
    condition: selection
falsepositives:
    - Legitimate application compatibility shims
    - Antivirus or security tool DLL registration
level: high
