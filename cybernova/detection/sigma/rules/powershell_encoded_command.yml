title: Suspicious PowerShell - Encoded Command
id: a7b8c9d0-e1f2-4a5b-8c7d-9e0f1a2b3c4d
description: Detects PowerShell execution with EncodedCommand parameter (common in attacks)
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: CyberNova
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains: '-EncodedCommand'
    condition: selection
falsepositives:
    - Administrative scripts
level: high
