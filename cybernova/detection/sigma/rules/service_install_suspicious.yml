title: Suspicious Service Installation
id: f6a7b8c9-d0e1-4f2a-3b4c-5d6e7f8a9b0c
description: Detects installation of services with suspicious names or binary paths
references:
    - https://attack.mitre.org/techniques/T1543/003/
author: CyberNova
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1543.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        EventID: 7045
        ImagePath|contains:
            - '\Temp\'
            - '\Users\Public\'
            - '\AppData\'
            - 'powershell'
            - 'cmd.exe'
    condition: selection
falsepositives:
    - Some legitimate software installers
level: high
