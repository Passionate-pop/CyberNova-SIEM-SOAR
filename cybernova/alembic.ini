# CyberNova - Alembic Configuration
# ============================================================
# Usage:  alembic upgrade head
#         alembic revision --autogenerate -m "description"
# ============================================================

[alembic]
script_location = alembic
prepend_sys_path = .
# Production: overridden by environment variable DATABASE_URL
# Usage:  DATABASE_URL=postgresql+psycopg://cybernova@localhost:5432/cybernova alembic upgrade head
sqlalchemy.url = postgresql+psycopg://cybernova@localhost:5432/cybernova

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
