name: Performance Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "cybernova/**/*.py"
      - "requirements.txt"

env:
  PYTHON_VERSION: "3.11"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cybernova_test
          POSTGRES_USER: cybernova
          POSTGRES_PASSWORD: cybernova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run performance benchmark
        env:
          DATABASE_URL: "postgresql+asyncpg://cybernova:cybernova_test@localhost:5432/cybernova_test"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: test-secret-key
          ENVIRONMENT: test
        run: python scripts/ci/benchmark_performance.py

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: .github/performance/results.json
          retention-days: 30
