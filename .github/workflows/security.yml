name: Security Scanner

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [master, develop]
    paths:
      - requirements.txt
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"

env:
  PYTHON_VERSION: "3.11"

jobs:
  dependency-scan:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install pip-audit
      - name: Audit with descriptions
        continue-on-error: true
        run: pip-audit -r requirements.txt --desc --ignore-vuln PYSEC-EXAMPLE
      - name: Audit (fail on critical/high)
        # PYSEC-2026-1325 (ecdsa) has NO upstream fix — python-ecdsa considers the
        # Minerva side-channel timing attack out of scope ("no planned fix").
        # Only affects ecdsa.SigningKey.sign_digest(); verification is unaffected.
        run: pip-audit -r requirements.txt --strict --ignore-vuln PYSEC-2026-1325

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install bandit
      - name: Run bandit SAST
        run: bandit -r cybernova/ -ll -x tests
      # bandit does not support SARIF output natively (only csv/json/html/xml/yaml).
      # Keep a JSON report artifact instead; the bandit -ll scan above is the gate.
      - name: Generate bandit JSON report
        if: always()
        run: |
          bandit -r cybernova/ -ll -x tests -f json -o bandit-results.json || true
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-results.json
          retention-days: 7

  secrets-scan:
    name: Secrets scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
