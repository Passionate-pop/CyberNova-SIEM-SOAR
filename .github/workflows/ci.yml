name: CI Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Stage 1: Lint (ruff) ─────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff
      - name: Lint with ruff
        run: ruff check cybernova/

  # ── Stage 2: Type-check (mypy) ───────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install mypy
          pip install -r requirements.txt
      - name: Type-check with mypy
        run: mypy cybernova/ --ignore-missing-imports --no-strict-optional

  # ── Stage 3: Unit tests ──────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install pytest pytest-asyncio httpx
          pip install -r requirements.txt
      - name: Run unit tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: test-secret-key
          ENVIRONMENT: test
        run: python -m pytest tests/unit/ tests/security/ -v --timeout=60

  # ── Stage 4: Integration tests ───────────────────────────────────────
  integration-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cybernova_test
          POSTGRES_USER: cybernova
          POSTGRES_PASSWORD: cybernova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install pytest pytest-asyncio httpx pytest-cov
          pip install -r requirements.txt
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://cybernova:cybernova_test@localhost:5432/cybernova_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          ENVIRONMENT: test
        run: >-
          python -m pytest
          tests/integration/ tests/test_*.py
          --ignore=tests/test_pipeline.py
          --ignore=tests/test_load.py
          --ignore=tests/test_shutdown.py
          -v --cov=cybernova --cov-report=xml --timeout=120
      - uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Stage 5: End-to-end tests ────────────────────────────────────────
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [integration-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cybernova_test
          POSTGRES_USER: cybernova
          POSTGRES_PASSWORD: cybernova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install pytest pytest-asyncio httpx
          pip install -r requirements.txt
      - name: Run e2e tests
        env:
          DATABASE_URL: postgresql+asyncpg://cybernova:cybernova_test@localhost:5432/cybernova_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          ENVIRONMENT: test
        run: python -m pytest tests/e2e/ -v --timeout=180

  # ── Stages 6-8: Build, scan & sign container image ────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
      id-token: write      # required for cosign keyless signing
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:ci-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: trivy-results.sarif

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign container image with cosign (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      - name: Verify image signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign verify "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
