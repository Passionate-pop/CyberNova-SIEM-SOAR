name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "cybernova-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "cybernova-frontend/**"

env:
  NODE_VERSION: "20"

jobs:
  # ── Stage 1: Type-check & Lint ─────────────────────────────────────
  typecheck-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cybernova-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cybernova-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check with TypeScript
        run: npx tsc --noEmit --pretty

      - name: Lint with ESLint
        run: npx eslint src/ --ext .ts,.tsx --max-warnings 0

      - name: Check formatting with Prettier
        run: npx prettier --check "src/**/*.{ts,tsx,css}"
        continue-on-error: true  # formatting warnings non-blocking for now

  # ── Stage 2: Build ─────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [typecheck-lint]
    defaults:
      run:
        working-directory: cybernova-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cybernova-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: cybernova-frontend/dist/
          retention-days: 7

  # ── Stage 3: Unit Tests ────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: [build]
    defaults:
      run:
        working-directory: cybernova-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cybernova-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npx vitest run --coverage

  # ── Stage 4: Docker build ──────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: cybernova-frontend/dist/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: cybernova-frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:ci-${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
