name: Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc*"

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Stage 1: Generate Changelog ─────────────────────────────────────
  changelog:
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.git-cliff.outputs.content }}
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog with git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        continue-on-error: true

  # ── Stage 2: Run Full Test Suite ────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: [changelog]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cybernova_test
          POSTGRES_USER: cybernova
          POSTGRES_PASSWORD: cybernova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install pytest pytest-asyncio httpx pytest-cov pytest-timeout
      - run: pip install -r requirements.txt

      - name: Run full test suite
        env:
          DATABASE_URL: postgresql+asyncpg://cybernova:cybernova_test@localhost:5432/cybernova_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: release-secret-key
          ENVIRONMENT: test
        run: |
          python -m pytest tests/unit/ tests/integration/ tests/e2e/ \
            tests/test_sigma_rules.py tests/test_cloud_rules.py \
            tests/test_detection_coverage.py \
            -v --timeout=180 --cov=cybernova --cov-report=xml

      - uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Stage 3: Build & Sign Docker Images ─────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        service:
          - { name: backend, context: ".", dockerfile: Dockerfile }
          - { name: frontend, context: cybernova-frontend, dockerfile: cybernova-frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Lowercase GHCR namespace (GHCR requires lowercase image names)
        run: echo "IMAGE_NS=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NS }}/${{ matrix.service.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NS }}/${{ matrix.service.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NS }}/${{ matrix.service.name }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-${{ matrix.service.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: trivy-${{ matrix.service.name }}.sarif

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign Docker image with cosign
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes "ghcr.io/${{ env.IMAGE_NS }}/${{ matrix.service.name }}@${{ steps.build.outputs.digest }}"

      - name: Verify cosign signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign verify "ghcr.io/${{ env.IMAGE_NS }}/${{ matrix.service.name }}@${{ steps.build.outputs.digest }}"

  # ── Stage 4: Create GitHub Release ──────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [docker, changelog]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.changelog.outputs.version }}
          name: Release ${{ needs.changelog.outputs.version }}
          body: ${{ needs.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: |
            CHANGELOG.md
            LICENSE
