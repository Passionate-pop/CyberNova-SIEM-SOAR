# git-cliff configuration file for CyberNova
# Generates changelog from conventional commit messages
[changelog]
header = "# Changelog\n\nAll notable changes to CyberNova are documented here.\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.breaking %} (BREAKING){% endif %}
{% endfor %}
{% endfor %}
"""
footer = "---\n_Changelog auto-generated by [git-cliff](https://github.com/orhun/git-cliff)_\n"
# Template to use for post-processing
template = "keepachangelog"
# Sort commits by scope and then by message
sort = "oldest"

[git]
# Parse conventional commits
conventional_commits = true
# Filter commits by these types
filter_unconventional = true
# Commit types to include in changelog
commit_types = [
    "feat",
    "fix",
    "perf",
    "refactor",
    "test",
    "docs",
    "style",
    "chore",
    "revert",
    "security",
]
# Group labels and their commit types
[git.undecorated_messages]
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^test", group = "Testing" },
    { message = "^docs", group = "Documentation" },
    { message = "^style", group = "Styling" },
    { message = "^chore", group = "Chores" },
    { message = "^revert", group = "Reverts" },
    { message = "^security", group = "Security" },
]
# Scopes to filter by
filter_commits = false
# Regex pattern to extract tag version from git tags
tag_pattern = "v[0-9].*"
# Regex to skip commits
skip_commits = ""
