server {
    listen 80;
    server_name _;
    include /etc/nginx/mime.types;
    root /usr/share/nginx/html;
    index index.html;

    # ── Health check ────────────────────────────────────────────────
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    # ── Agent install scripts — proxy to backend ──────────────────
    location = /agent.ps1 {
        proxy_pass http://backend:8000/agent.ps1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location = /agent.py {
        proxy_pass http://backend:8000/agent.py;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location = /agent.sh {
        proxy_pass http://backend:8000/agent.sh;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── WebSocket — proxy to backend ────────────────────────────────
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── API Proxy — forward /api/ to backend ──────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # ── SPA — serve from root, fallback to index.html for routing ──
    # Note: The SPA is built with VITE_BASE_PATH=/app/ so asset URLs
    # are /app/assets/... When accessed through the unified nginx at
    # /app/, the /app/ prefix is stripped and assets resolve correctly.
    location /app/ {
        rewrite ^/app(/.*)$ $1 break;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Direct root access (e.g., for health checks)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;

    # ── Cache busting ──────────────────────────────────────────────
    # Never cache HTML so new builds with different file hashes are always picked up
    location ~* \.html?$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Cache JS/CSS/assets aggressively since they have content-based hashes
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        expires 1y;
    }
}
