server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Health check endpoint ────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # ── /app/ prefix — direct port-8080 access ──────────────────────
    # When nginx-unified proxies /app/ -> frontend, it strips /app/
    # from the upstream request. But direct :8080 access keeps /app/.
    # This location rewrites /app/<path> -> /<path> so assets load.
    # Health check for docker-compose healthcheck probe
    location = /app/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    location /app/ {
        rewrite ^/app(/.*)$ $1 break;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # ── Root path — SPA catch-all for proxied requests ──────────────
    # When unified nginx proxies /app/ -> frontend, the prefix is
    # stripped, so requests arrive as /assets/... or / (index).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Explicit index.html for direct /app/ access ──────────────────
    location = /app {
        return 301 /app/;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
}
